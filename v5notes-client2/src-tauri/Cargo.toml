[package]
name = "v5notes"
version = "2.0.0"
edition = "2021"

[lib]
name = "v5notes_client2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Export needs image bytes from the notes server and third-party hosts that do
# not send CORS headers; the webview cannot read those responses.
reqwest = { version = "0.13", default-features = false, features = ["default-tls", "http2"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.7.0"
tauri-plugin-deep-link = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

# macOS: vector PDF via WKWebView.createPDF + Core Graphics repagination.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = "0.3"
objc2-core-graphics = { version = "0.3", features = ["CGContext", "CGDataProvider", "CGPDFContext", "CGPDFDocument", "CGPDFPage"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSDate", "NSGeometry", "NSObject", "NSRunLoop", "NSString", "NSURL"] }
objc2-web-kit = { version = "0.3", features = ["WKPDFConfiguration", "WKWebView"] }
block2 = "0.6"
