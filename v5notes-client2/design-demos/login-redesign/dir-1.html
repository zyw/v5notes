<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>V5Notes · 登录 / 纸呼吸</title>
<style>
/* ============================================================
   白 · 纸呼吸 —— 登录页重设计 dir-1
   一整叶纸（左）｜一条竖发丝线｜右栏登录去卡片化
   动效：三层极慢墨晕 + 左上柔光呼吸 + 静态纸纤维 + 6px 视差
   时间由 URL ?t= 冻结（canvas 单帧 + CSS/WAAPI 全部定帧）
   ============================================================ */
:root{
  --paper:#fffefa;   --canvas:#f4f2ec;
  --ink:#27342d;     --ink-2:#364c3b;
  --muted:#5f6f62;   --muted-2:#64746a;  --muted-desk:#586a5d;
  --accent:#315b4a;  --accent-deep:#244c3b;  --accent-soft:#e9eee8;
  --line:#e4e6df;    --line-soft:#efefe9;    --edge:#d8ded3;
  --teal:#0b4a52;    --mint:#2fa9a4;         --danger:#a7483d;
  --serif:'Songti SC','Noto Serif SC','Source Han Serif SC',serif;
  --sans:'PingFang SC','Helvetica Neue',-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:'SF Mono',ui-monospace,Menlo,monospace;
  --fiber:none;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--sans);color:var(--ink);background:var(--canvas);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
::selection{background:#dbe6d7}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- 舞台 ---------- */
.stage{
  position:relative;display:grid;grid-template-columns:62fr 38fr;min-height:100vh;
  overflow:hidden;
  background:linear-gradient(163deg,#f4f1e8 0%,#f0ede2 46%,#eae7da 100%);
}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;will-change:transform;transform-origin:50% 50%}
.rhs-fiber{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  background-image:var(--fiber);opacity:.85;
}

/* ---------- 左页：一整叶纸 ---------- */
.paper{
  position:relative;z-index:2;display:flex;flex-direction:column;
  padding:72px 96px 64px 112px;
  background-color:var(--paper);
  background-image:var(--fiber);
  border-right:1px solid #d2d8cb;
}
/* 页口（装订侧）的暗部：纸在折口处微微卷下去 */
.paper::after{
  content:'';position:absolute;top:0;bottom:0;right:0;width:46px;pointer-events:none;
  background:linear-gradient(270deg,rgba(39,52,45,.075),rgba(39,52,45,.018) 62%,rgba(39,52,45,0));
}
/* 纸对右侧画布投下的极轻影子 */
.paper::before{
  content:'';position:absolute;top:0;bottom:0;right:-1px;width:38px;pointer-events:none;
  background:linear-gradient(90deg,rgba(40,52,36,.14),rgba(40,52,36,.035) 55%,rgba(40,52,36,0));
}
.paper > .paper-head,.paper > .hero,.paper > .note,.paper > .paper-foot{position:relative;z-index:1}
.paper-sheen{
  position:absolute;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(152deg,#fffdf6 0%,#fdfbf3 40%,#f1f3e7 100%);
  opacity:.34;animation:paperBreathe 18s ease-in-out infinite;
}
@keyframes paperBreathe{0%,100%{opacity:.24}50%{opacity:.5}}

/* 页眉：品牌 + 三种模式 */
.paper-head{display:flex;align-items:center;justify-content:space-between;gap:28px;min-height:24px;animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand img{display:block;width:24px;height:24px;border-radius:6px;box-shadow:0 1px 2px rgba(39,52,45,.2)}
.wordmark{font-size:12px;font-weight:600;letter-spacing:.19em;color:#4a6153;white-space:nowrap}
.modes{display:flex;align-items:center;gap:9px;margin:0;font-size:12px;line-height:1.7;color:var(--muted-2);white-space:nowrap}
.modes .sep{color:#c6d0c4}
.modes .on{color:var(--accent);font-weight:600}

/* 标题区 */
.hero{margin-top:clamp(48px,8.4vh,76px);display:flex;flex-direction:column}
h1{
  margin:0;font-family:var(--serif);font-weight:500;
  font-size:clamp(60px,5.6vw,84px);line-height:1.14;letter-spacing:-.02em;
  color:var(--accent-deep);
  animation:rise .55s cubic-bezier(.2,.7,.2,1) .04s both;
}
.subtitle{
  margin:19px 0 0;font-size:15px;line-height:1.72;letter-spacing:.02em;color:var(--muted);
  animation:rise .5s cubic-bezier(.2,.7,.2,1) .1s both;
}

/* 纸上的笔记 */
.note{margin-top:clamp(64px,10.6vh,96px);animation:rise .55s cubic-bezier(.2,.7,.2,1) .16s both}
.note-rule{display:block;width:46px;height:1px;background:#d5dbd0}
.note h2{
  margin:29px 0 0;font-family:var(--serif);font-weight:600;
  font-size:36px;line-height:1.34;letter-spacing:-.012em;color:#2b4436;
}
.lines{margin-top:20px}
.lines p{margin:0;font-size:16.5px;line-height:2.1;letter-spacing:.012em;color:#4c5f53}
.caret{
  display:inline-block;width:1.5px;height:17px;margin-left:7px;vertical-align:-2px;
  background:var(--accent);animation:caret 1.15s ease-in-out infinite;
}
@keyframes caret{0%,100%{opacity:1}50%{opacity:.12}}

/* 历史刻度：纸边的一道版本尺 */
.history{
  position:absolute;right:0;bottom:calc(100% + 16px);z-index:1;
  display:flex;flex-direction:column;align-items:flex-end;gap:12px;
  padding-right:0;
  animation:fade .55s ease .22s both;
}
.history::before{content:'';position:absolute;top:-2px;right:0;bottom:-2px;width:1px;background:#e0e5db}
.h-tick{display:block;height:1px;background:#c4cec0}
.h-tick:nth-child(1){width:14px}
.h-tick:nth-child(2){width:20px}
.h-tick:nth-child(3){width:34px}
.h-tick:nth-child(4){width:15px}
.h-tick:nth-child(5){width:23px}
.h-tick:nth-child(6){width:11px}
.h-tick.is-current{position:relative;width:34px;background:var(--accent)}
.h-tick.is-current em{
  position:absolute;right:calc(100% + 11px);top:50%;transform:translateY(-50%);
  font-style:normal;font-size:12px;letter-spacing:.06em;color:var(--muted-2);white-space:nowrap;
}

/* 地脚：留白最大，注脚落在最下 */
.paper-foot{position:relative;margin-top:clamp(40px,7vh,64px);animation:fade .5s ease .18s both}
.foot-rule{display:block;height:1px;background:#dfe4da}
.foot-row{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin-top:16px}
.foot-item{margin:0;font-size:12px;line-height:1.7;letter-spacing:.01em;color:var(--muted);white-space:nowrap}
.foot-name{color:#4a5f52;font-weight:600}
.foot-sep{margin:0 4px;color:#a9b4a8}
.foot-meta{margin:0;font-size:12px;line-height:1.7;letter-spacing:.04em;color:var(--muted-2);white-space:nowrap}

/* ---------- 右栏：去卡片的登录窄栏 ---------- */
.login-side{
  position:relative;z-index:3;display:flex;align-items:center;justify-content:flex-end;
  padding-right:96px;
}
.login-scrim{
  position:absolute;inset:150px 16px 150px 6px;pointer-events:none;
  background:radial-gradient(ellipse at 54% 50%,rgba(255,254,250,.34) 0%,rgba(255,254,250,.2) 46%,rgba(255,254,250,0) 78%);
}
.login{position:relative;z-index:1;width:352px;display:flex;flex-direction:column;padding-block:88px}

.login-label{
  margin:0;font-size:12.5px;font-weight:600;line-height:1.5;letter-spacing:.03em;color:#4e6456;
  animation:rise .5s cubic-bezier(.2,.7,.2,1) .06s both;
}
.login-rule{height:1px;margin-top:13px;background:var(--line);animation:fade .5s ease .08s both}
.server{
  display:flex;align-items:center;gap:10px;margin-top:13px;
  font-size:12.5px;line-height:1.7;color:var(--muted-desk);animation:rise .5s cubic-bezier(.2,.7,.2,1) .1s both;
}
.dot{width:6px;height:6px;flex:0 0 6px;border-radius:50%;background:#4d8060;box-shadow:0 0 0 3px rgba(77,128,96,.14)}
.server strong{font-weight:600;color:#2f4436}
.server-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.change{
  margin-left:auto;margin-top:-7px;margin-bottom:-7px;padding:0 2px;min-height:40px;
  display:inline-flex;align-items:center;font-size:12px;font-weight:600;letter-spacing:.02em;
  color:var(--accent);border-radius:4px;
}
.change:hover{text-decoration:underline;text-underline-offset:3px}

.field{display:flex;flex-direction:column;margin-top:42px;animation:rise .5s cubic-bezier(.2,.7,.2,1) .14s both}
#field-password{animation-delay:.18s}
.field + .field{margin-top:30px}
.field input[type="password"]{letter-spacing:-.055em;font-size:16px}
.field label{font-size:12px;font-weight:600;line-height:1.5;letter-spacing:.04em;color:var(--ink-2)}
.field input{
  height:46px;margin-top:6px;padding:0 2px;background:transparent;border:0;
  border-bottom:1px solid #cdd6c9;border-radius:0;
  font-size:15.5px;line-height:1.5;letter-spacing:.01em;color:var(--ink);
  transition:border-color .16s ease,box-shadow .16s ease;
}
.field input::placeholder{color:#9aa79c}
.field input:hover{border-bottom-color:#b6c3b4}
.field input:focus{outline:none;border-bottom-color:var(--accent);box-shadow:0 1px 0 var(--accent)}
.field input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.field.is-error input{border-bottom-color:#bd685c}

.submit{
  display:flex;align-items:center;justify-content:center;gap:10px;
  margin-top:48px;height:48px;border-radius:10px;
  background:var(--accent);color:#fff;
  font-size:14px;font-weight:600;letter-spacing:.06em;
  box-shadow:0 1px 2px rgba(36,70,54,.18),0 6px 14px rgba(36,70,54,.1);
  transition:background .16s ease,box-shadow .16s ease,transform .16s ease;
  animation:rise .55s cubic-bezier(.2,.7,.2,1) .22s both;
}
.submit:hover:not(:disabled){background:var(--accent-deep);box-shadow:0 2px 3px rgba(36,70,54,.22),0 10px 22px rgba(36,70,54,.16)}
.submit:active:not(:disabled){transform:translateY(1px);box-shadow:0 1px 2px rgba(36,70,54,.22)}
.submit:disabled{cursor:default;opacity:.72;box-shadow:none}
.cta-mark{
  display:grid;place-items:center;width:26px;height:26px;flex:0 0 26px;border-radius:50%;
  background:rgba(255,255,255,.16);
}
.cta-mark svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.status{
  min-height:24px;margin:14px 0 0;font-size:14px;line-height:1.7;letter-spacing:.01em;color:var(--danger);
  animation:fade .4s ease .26s both;
}
.status:empty{animation:none}

/* 右上齿轮（与现状一致 36×36） */
.gear{
  position:absolute;z-index:6;top:34px;right:44px;width:36px;height:36px;
  display:grid;place-items:center;border-radius:9px;color:#63766a;
  animation:fade .55s ease .1s both;
}
.gear:hover{background:rgba(49,91,74,.08);color:var(--accent)}
.gear svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}

@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---------- 1280–1360 ---------- */
@media (max-width:1360px){
  .paper{padding:62px 76px 56px 92px}
  .login-side{padding-right:66px}
  .login{width:340px}
  .login-side .login-scrim{inset:100px 16px 100px 0}
}

/* ---------- 375 单列 ---------- */
@media (max-width:900px){
  html,body{height:auto;overflow-x:hidden}
  .stage{display:block;overflow-x:hidden;background:linear-gradient(176deg,#f6f4ee,#efeee6)}
  #bg{position:fixed}
  .paper{
    padding:22px 22px 16px;border-right:0;border-bottom:1px solid var(--edge);
  }
  .paper::before,.paper::after{display:none}
  .paper-head{flex-wrap:wrap;gap:6px 14px;padding-right:42px}
  .brand img{width:22px;height:22px}
  .brand{gap:9px}
  .modes{order:3;flex-basis:100%;margin-top:0;font-size:12px}
  .hero{margin-top:20px}
  h1{font-size:32px;line-height:1.16}
  .subtitle{margin-top:9px;font-size:13.5px;line-height:1.7}
  .note{margin-top:20px}
  .note h2{margin-top:13px;font-size:23px;line-height:1.3}
  .lines{margin-top:7px}
  .lines p{font-size:14.5px;line-height:1.9}
  .history{display:none}
  .paper-foot{margin-top:18px}
  .foot-row{flex-wrap:wrap;gap:6px 14px;margin-top:10px}
  .foot-item{white-space:normal}
  .foot-desc,.foot-sep{display:none}
  .foot-meta{margin-left:auto}
  .login-side{display:block;padding:24px 22px 20px}
  .login-scrim{display:none}
  .login{width:100%;padding-block:0}
  .login-rule{margin-top:11px}
  .server{margin-top:11px}
  .field{margin-top:22px}
  .field + .field{margin-top:18px}
  .field input{height:44px}
  .submit{margin-top:28px;height:46px}
  .status{margin-top:8px;min-height:20px;font-size:13.5px}
  .gear{top:16px;right:12px;background:rgba(255,254,250,.72)}
}
</style>
</head>

    fg.addColorStop(0.42, 'rgba(47,169,164,' + (fAlpha * 0.55).toFixed(3) + ')');
    fg.addColorStop(0.75, 'rgba(47,169,164,' + (fAlpha * 0.16).toFixed(3) + ')');
    fg.addColorStop(1, 'rgba(47,169,164,0)');
    ctx.fillStyle = fg;
    ctx.fillRect(-W, -H * 1.4, W * 2, H * 2.8);
    ctx.restore();

    /* 右下角的极轻暗角：让右侧画布有桌面深度 */
    var vg = ctx.createRadialGradient(W * 1.02, H * 1.06, 0, W * 1.02, H * 1.06, Math.max(W, H) * 0.62);
    vg.addColorStop(0, 'rgba(66,74,56,0.026)');
    vg.addColorStop(1, 'rgba(66,74,56,0)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  /* ---------- 3 · 状态（error / busy） ---------- */
  var statusEl = document.getElementById('status');
  var submitEl = document.getElementById('submit');
  var submitText = document.getElementById('submit-text');
  var fieldPassword = document.getElementById('field-password');
  var busy = stateParam === 'busy';
  var errored = stateParam === 'error';
  var lastError = '用户不存在/密码错误';

  function renderState() {
    submitEl.disabled = busy;
    submitText.textContent = busy ? '正在连接…' : '进入笔记';
    statusEl.textContent = (!busy && errored) ? lastError : '';
    fieldPassword.classList.toggle('is-error', !busy && errored);
  }
  renderState();

  document.getElementById('login').addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (busy) return;
    busy = true; errored = false; renderState();
    window.setTimeout(function () {
      busy = false; errored = true; renderState();
    }, 1400);
  });
  document.getElementById('change').addEventListener('click', function () {
    document.getElementById('username').focus();
  });
  document.getElementById('gear').addEventListener('click', function () {
    /* 原型：设置弹窗不在本方向范围内 */
  });

  /* ---------- 4 · 时间：冻结 or 活 ---------- */
  var rafId = 0;
  var running = false;
  var frozen = hasT || REDUCED;
  var FREEZE_AT = FIXED_T !== null ? FIXED_T : 2.4;

  function freezeAt(t) {
    var anims = document.getAnimations ? document.getAnimations() : [];
    anims.forEach(function (a) {
      try {
        a.currentTime = t * 1000;
        a.pause();
      } catch (e) { /* 个别动画不可定帧则忽略 */ }
    });
    if (!W) resize();
    paint(t);
  }

  function tick(now) {
    if (!running) return;
    paint(now / 1000);
    rafId = requestAnimationFrame(tick);
  }
  function start() {
    if (running || frozen) return;
    running = true;
    rafId = requestAnimationFrame(tick);
  }
  function stop() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = 0;
  }

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stop();
    else if (!frozen) start();
  });

  /* 桌面 6px 视差 */
  if (!frozen && window.matchMedia('(hover: hover)').matches) {
    cv.style.transition = 'transform .7s cubic-bezier(.2,.7,.2,1)';
    document.getElementById('stage').addEventListener('mousemove', function (e) {
      var dx = (e.clientX / window.innerWidth - 0.5) * 2 * 6;
      var dy = (e.clientY / window.innerHeight - 0.5) * 2 * 6;
      cv.style.transform = 'translate3d(' + (-dx).toFixed(2) + 'px,' + (-dy).toFixed(2) + 'px,0) scale(1.012)';
    });
  }

  window.addEventListener('resize', function () {
    resize();
    if (frozen) freezeAt(FREEZE_AT);
    else paint(performance.now() / 1000);
  });
  mqReduce.addEventListener && mqReduce.addEventListener('change', function (e) {
    REDUCED = e.matches || reduceQuery;
    if (REDUCED) { stop(); freezeAt(FREEZE_AT); }
  });

  /* ---------- 5 · 启动 ---------- */
  function boot() {
    resize();
    if (frozen) {
      freezeAt(FREEZE_AT);
      /* 字体落位后再定一次帧，避免字宽变化影响观感 */
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function () {
          requestAnimationFrame(function () { freezeAt(FREEZE_AT); });
        });
      }
    } else {
      start();
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
