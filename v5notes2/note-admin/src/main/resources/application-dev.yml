--- # snail-job 配置
snail-job:
  enabled: false
  # 需要在 SnailJob 后台组管理创建对应名称的组,然后创建任务的时候选择对应的组,才能正确分派任务
  group: "v5notes_group"
  # SnailJob 接入验证令牌 详见 script/sql/ry_job.sql `sj_group_config` 表
  token: ${V5NOTES_SNAIL_JOB_TOKEN:SJ_cKqBTPzCsWA3VyuCfFoccmuIEGXjr5KT}
  server:
    host: 127.0.0.1
    port: 17888
  # 命名空间UUID 详见 script/sql/v5notes_job.sql `sj_namespace`表`unique_id`字段
  namespace: ${spring.profiles.active}
  # 随主应用端口漂移
  port: 2${server.port}
  # 客户端ip指定
  host:

--- # MyBatis Plus 配置
mybatis-plus:
  sql-log:
    # 完整 SQL 输出开关
    enabled: true
    # 输出方式，可选 console、log
    output: console
    # 忽略高频轮询表的成功 SQL 日志；执行异常仍会输出
    ignore-tables: [flow_event_wait]

--- # 数据源配置
spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    # 动态数据源文档 https://www.kancloud.cn/tracy5546/dynamic-datasource/content
    dynamic:
      # 只注册 master 这一个数据源。dynamic-datasource 会把配置里出现的每个数据源都建一个
      # Hikari 池并立刻真连一次，所以这里不能并列写 mysql / postgresql 两个块。
      # 连哪个库由 v5notes.db-dialect 决定，见下方 v5notes.datasource.*。
      primary: master
      # 严格模式 匹配不到数据源则报错
      strict: true
      datasource:
        master:
          type: ${spring.datasource.type}
          # 驱动、连接串和账号按当前方言取值。未被选中的那组只是备用配置，不会建池也不连接
          driverClassName: ${v5notes.datasource.${v5notes.db-dialect}.driver-class-name}
          url: ${v5notes.datasource.${v5notes.db-dialect}.url}
          username: ${v5notes.datasource.${v5notes.db-dialect}.username}
          password: ${v5notes.datasource.${v5notes.db-dialect}.password}
      hikari:
        # 最大连接池数量
        maxPoolSize: 20
        # 最小空闲线程数量
        minIdle: 10
        # 配置获取连接等待超时的时间
        connectionTimeout: 30000
        # 校验超时时间
        validationTimeout: 5000
        # 空闲连接存活最大时间，默认10分钟
        idleTimeout: 600000
        # 此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认30分钟
        maxLifetime: 1800000
        # 多久检查一次连接的活性
        keepaliveTime: 30000

--- # 各方言的连接参数：只有 v5notes.db-dialect 选中的那一组会被注册成数据源并真正连接
# 切方言时只改 application.yml 里的 v5notes.db-dialect 即可，这里两组都留着备用。
v5notes:
  datasource:
    mysql:
      driver-class-name: com.mysql.cj.jdbc.Driver
      # jdbc 所有参数配置参考 https://lionli.blog.csdn.net/article/details/122018562
      # rewriteBatchedStatements=true 批处理优化 大幅提升批量插入更新删除性能(对数据库有性能损耗 使用批量操作应考虑性能问题)
      url: ${V5NOTES_DATASOURCE_MYSQL_URL:jdbc:mysql://192.168.10.12:3306/v5notes2-dev?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&autoReconnect=true&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true}
      username: ${V5NOTES_DATASOURCE_MYSQL_USERNAME:root}
      password: "${V5NOTES_DATASOURCE_MYSQL_PASSWORD:admin123#}"
    postgresql:
      driver-class-name: org.postgresql.Driver
      url: ${V5NOTES_DATASOURCE_POSTGRESQL_URL:jdbc:postgresql://localhost:5432/v5notes2-dev?useUnicode=true&characterEncoding=utf8&useSSL=true&autoReconnect=true&reWriteBatchedInserts=true}
      username: ${V5NOTES_DATASOURCE_POSTGRESQL_USERNAME:root}
      password: ${V5NOTES_DATASOURCE_POSTGRESQL_PASSWORD:root}

--- # redis 单机配置(单机与集群只能开启一个另一个需要注释掉)
spring.data:
  redis:
    # 地址
    host: ${V5NOTES_REDIS_HOST:192.168.10.13}
    # 端口，默认为6379
    port: ${V5NOTES_REDIS_PORT:6379}
    # 数据库索引
    database: ${V5NOTES_REDIS_DATABASE:0}
    # redis 密码必须配置
    password: ${V5NOTES_REDIS_PASSWORD:9LqZSbo6JL3sfzT3jeTOrjp1cc4D1uU3}
    # 连接超时时间
    timeout: 10s
    # 是否开启ssl
    ssl.enabled: false

# redisson 配置
redisson:
  # redis key前缀
  keyPrefix:
  # 线程池数量
  threads: 4
  # Netty线程池数量
  nettyThreads: 8
  # 单节点配置
  singleServerConfig:
    # 客户端名称 不能用中文
    clientName: V5Notes2
    # 最小空闲连接数
    connectionMinimumIdleSize: 8
    # 连接池大小
    connectionPoolSize: 32
    # 连接空闲超时，单位：毫秒
    idleConnectionTimeout: 10000
    # 命令等待超时，单位：毫秒
    timeout: 3000
    # 发布和订阅连接池大小
    subscriptionConnectionPoolSize: 50

--- # mail 邮件发送
# 错误根因常见：host 不可达（如 smtp.sina.com 超时）、未配授权码、465 同时开了 STARTTLS
# 本地联调可 dry-run=true（不发信，验证码打日志）；真实发信请配 163/QQ 等 SMTP 授权码
# 465 + SSL：starttlsEnable=false；587 + STARTTLS：sslEnable=false、starttlsEnable=true
mail:
  enabled: ${V5NOTES_MAIL_ENABLED:true}
  dry-run: ${V5NOTES_MAIL_DRY_RUN:true}
  host: ${V5NOTES_MAIL_HOST:smtp.sina.com}
  port: ${V5NOTES_MAIL_PORT:465}
  # 是否需要用户名密码验证
  auth: true
  # 发送方，遵循RFC-822标准
  from: ${V5NOTES_MAIL_FROM:xxx@sina.com}
  # 用户名（注意：如果使用foxmail邮箱，此处user为qq号）
  user: ${V5NOTES_MAIL_USER:xxx@sina.com}
  # 密码（注意，某些邮箱需要为SMTP服务单独设置密码，详情查看相关帮助）
  pass: ${V5NOTES_MAIL_PASSWORD:xxxxxxxxxx}
  # 465/SSL 不要同时开 STARTTLS，否则部分服务商会认证失败或返回 451
  starttlsEnable: ${V5NOTES_MAIL_STARTTLS:false}
  # 使用SSL安全连接
  sslEnable: ${V5NOTES_MAIL_SSL:true}
  # SMTP超时时长，单位毫秒
  timeout: 10000
  # Socket连接超时值，单位毫秒
  connectionTimeout: 10000

--- # sms 短信 支持 阿里云 腾讯云 云片 等等各式各样的短信服务商
# https://sms4j.com/doc3/ 差异配置文档地址 支持单厂商多配置，可以配置多个同时使用
sms:
  # 配置源类型用于标定配置来源(interface,yaml)
  config-type: yaml
  # 用于标定yml中的配置是否开启短信拦截，接口配置不受此限制
  restricted: true
  # 短信拦截限制单手机号每分钟最大发送，只对开启了拦截的配置有效
  minute-max: 1
  # 短信拦截限制单手机号每日最大发送量，只对开启了拦截的配置有效
  account-max: 30
  # 以下配置来自于 org.dromara.sms4j.provider.config.BaseConfig类中
  blends:
    # 唯一ID 用于发送短信寻找具体配置 随便定义别用中文即可
    # 可以同时存在两个相同厂商 例如: ali1 ali2 两个不同的阿里短信账号 也可用于区分租户
    config1:
      # 框架定义的厂商名称标识，标定此配置是哪个厂商，详细请看厂商标识介绍部分
      supplier: alibaba
      # 有些称为accessKey有些称之为apiKey，也有称为sdkKey或者appId。
      access-key-id: ${V5NOTES_SMS_ALIBABA_ACCESS_KEY_ID:您的accessKey}
      # 称为accessSecret有些称之为apiSecret
      access-key-secret: ${V5NOTES_SMS_ALIBABA_ACCESS_KEY_SECRET:您的accessKeySecret}
      signature: ${V5NOTES_SMS_ALIBABA_SIGNATURE:您的短信签名}
      sdk-app-id: ${V5NOTES_SMS_ALIBABA_SDK_APP_ID:您的sdkAppId}
    config2:
      # 厂商标识，标定此配置是哪个厂商，详细请看厂商标识介绍部分
      supplier: tencent
      access-key-id: ${V5NOTES_SMS_TENCENT_ACCESS_KEY_ID:您的accessKey}
      access-key-secret: ${V5NOTES_SMS_TENCENT_ACCESS_KEY_SECRET:您的accessKeySecret}
      signature: ${V5NOTES_SMS_TENCENT_SIGNATURE:您的短信签名}
      sdk-app-id: ${V5NOTES_SMS_TENCENT_SDK_APP_ID:您的sdkAppId}


--- # 三方授权
justauth:
  # 回调地址怎么配（请只改下面两个基址，不要靠 type.*.redirect-uri 区分端）：
  #   1) 请求带 app=admin（默认）→ {address}/social-callback?source={平台}
  #   2) 请求带 app=client       → {client-address}/social-callback?source={平台}
  #   3) type.*.redirect-uri     → 仅当 address 与 client-address 都未配置时的兜底，可省略
  # 向 Gitee/GitHub 等登记回调时，按实际用到的端分别登记上述拼装结果。
  # 管理端前端地址
  address: http://localhost:80
  # 笔记客户端回调基址：指向 v5notes-oauth-landing（HTTPS 中转唤起桌面）；或平台允许时用 v5notes://app
  # 不要指向 Vite/SPA：客户端不做浏览器换票，也不在 SPA 里写 v5notes:// 唤起
  # 国内访问 GitHub 换票时，可按 JustAuth 文档为对应平台配置 httpConfig 代理
  client-address: http://127.0.0.1:8088
  type:
    gitee:
      client-id: ${V5NOTES_GITEE_CLIENT_ID:a27e9fa3f58a199995b366abc2632e4448f8680c97b45bce86b5cf27590bcbe5}
      client-secret: ${V5NOTES_GITEE_CLIENT_SECRET:917ed393687424caa4884f0850557122c20b74f26a9638575a7b816bf55c4fa2}
      # 兜底；已配置 address/client-address 时运行时不会用到本字段
      redirect-uri: ${justauth.address}/social-callback?source=gitee
      # emails 非 JustAuth 默认 scope；/user.email 常为空，需另调 /emails
      scopes: [user_info, emails]
    github:
      client-id: ${V5NOTES_GITHUB_CLIENT_ID:10**********6}
      client-secret: ${V5NOTES_GITHUB_CLIENT_SECRET:1f7d08**********5b7**********29e}
      # 兜底；已配置 address/client-address 时运行时不会用到本字段
      redirect-uri: ${justauth.address}/social-callback?source=github
      scopes: [user, user:email]
