name: Publish v5notes2 API image

# 创建并发布 GitHub Release 时打包推送 API 镜像；也可在 Actions 里手动跑。
# 版本号从 Release tag 解析：v2.0.0 / 2.0.0 → 镜像标签 2.0.0。

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'zyw/v5notes'
    runs-on: ubuntu-latest
    env:
      IMAGE: onedev.v5ai.xin/docker-imgs/v5notes2-api
    steps:
      - name: Check OneDev credentials
        env:
          ONEDEV_USERNAME: ${{ secrets.ONEDEV_USERNAME || vars.ONEDEV_USERNAME }}
          ONEDEV_TOKEN: ${{ secrets.ONEDEV_TOKEN }}
        run: |
          missing=()
          [[ -z "${ONEDEV_USERNAME}" ]] && missing+=('ONEDEV_USERNAME')
          [[ -z "${ONEDEV_TOKEN}" ]] && missing+=('ONEDEV_TOKEN')
          if ((${#missing[@]})); then
            echo "Missing required Actions credentials: ${missing[*]}" >&2
            echo "Add ONEDEV_USERNAME (secret or variable) and ONEDEV_TOKEN (secret) under Settings → Secrets and variables → Actions." >&2
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Package API
        working-directory: v5notes2
        run: |
          sh ./mvnw --batch-mode -DskipTests package
          test -s note-admin/target/v5notes2.jar

      - name: Set image tags
        id: image
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          tags="$IMAGE:sha-$GITHUB_SHA"
          raw_tag="${RELEASE_TAG:-}"
          if [[ -z "$raw_tag" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            raw_tag="$GITHUB_REF_NAME"
          fi
          if [[ -n "$raw_tag" ]]; then
            version="$raw_tag"
            version="${version#api-v5notes2-}"
            version="${version#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tag '$raw_tag' 无法解析为 x.y.z（支持 v2.0.0、2.0.0）。" >&2
              exit 1
            fi
            tags="$tags,$IMAGE:$version"
            echo "将推送版本标签: $IMAGE:$version"
          else
            echo "手动运行且未选 tag，只推送: $IMAGE:sha-$GITHUB_SHA"
          fi
          printf 'tags=%s\n' "$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: onedev.v5ai.xin
          username: ${{ secrets.ONEDEV_USERNAME || vars.ONEDEV_USERNAME }}
          password: ${{ secrets.ONEDEV_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./v5notes2
          file: v5notes2/docker/server/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tags }}
