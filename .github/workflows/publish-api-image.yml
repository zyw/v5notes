name: Publish v5notes2 API image

# 创建并发布 GitHub Release 时打包推送 API 镜像；也可在 Actions 里手动跑。
# 镜像版本：手动输入优先；未输入则用当前 Release（发布事件）或最新正式 Release 的 tag。
# tag 解析：v2.0.0 / 2.0.0 → 镜像标签 2.0.0。

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Docker 镜像版本（如 2.0.0）；留空则用最新正式 Release 的版本"
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'zyw/v5notes'
    runs-on: ubuntu-latest
    env:
      IMAGE: onedev.v5ai.xin/docker-imgs/v5notes2-api
    steps:
      - name: Check OneDev credentials
        env:
          ONEDEV_USERNAME: ${{ secrets.ONEDEV_USERNAME || vars.ONEDEV_USERNAME }}
          ONEDEV_TOKEN: ${{ secrets.ONEDEV_TOKEN }}
        run: |
          missing=()
          [[ -z "${ONEDEV_USERNAME}" ]] && missing+=('ONEDEV_USERNAME')
          [[ -z "${ONEDEV_TOKEN}" ]] && missing+=('ONEDEV_TOKEN')
          if ((${#missing[@]})); then
            echo "Missing required Actions credentials: ${missing[*]}" >&2
            echo "Add ONEDEV_USERNAME (secret or variable) and ONEDEV_TOKEN (secret) under Settings → Secrets and variables → Actions." >&2
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Package API
        working-directory: v5notes2
        run: |
          sh ./mvnw --batch-mode -DskipTests package
          test -s note-admin/target/v5notes2.jar

      - name: Set image tags
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          normalize_version() {
            local raw="$1"
            local version="$raw"
            version="${version#api-v5notes2-}"
            version="${version#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "版本 '$raw' 无法解析为 x.y.z（支持 2.0.0、v2.0.0）。" >&2
              return 1
            fi
            printf '%s\n' "$version"
          }

          raw_tag="${INPUT_VERSION:-}"
          source="手动输入"
          if [[ -z "$raw_tag" ]]; then
            raw_tag="${RELEASE_TAG:-}"
            source="当前 Release"
          fi
          if [[ -z "$raw_tag" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            raw_tag="$GITHUB_REF_NAME"
            source="当前 tag"
          fi
          if [[ -z "$raw_tag" ]]; then
            raw_tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 20 --json tagName,isPrerelease,isDraft \
              -q '[.[] | select(.isPrerelease == false and .isDraft == false)][0].tagName' || true)"
            source="最新正式 Release"
          fi
          if [[ -z "$raw_tag" || "$raw_tag" == "null" ]]; then
            echo "未输入版本，且仓库没有可用的正式 Release，无法确定镜像版本。" >&2
            exit 1
          fi

          version="$(normalize_version "$raw_tag")"
          tags="$IMAGE:sha-$GITHUB_SHA,$IMAGE:$version"
          echo "版本来源: $source（$raw_tag）→ $IMAGE:$version"
          printf 'tags=%s\n' "$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: onedev.v5ai.xin
          username: ${{ secrets.ONEDEV_USERNAME || vars.ONEDEV_USERNAME }}
          password: ${{ secrets.ONEDEV_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./v5notes2
          file: v5notes2/docker/server/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tags }}
