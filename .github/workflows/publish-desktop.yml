# 构建并上传 v5notes 桌面端安装包与更新包。
#
# 平台：macOS Apple 芯片、macOS Intel、Windows x64（不发布 Linux）。
# 触发：推送 v* tag，或 Actions → Run workflow。
#
# 需要仓库 Secrets：
#   TAURI_SIGNING_PRIVATE_KEY           更新包 minisign 私钥（必填）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  私钥口令（无私钥口令可留空或不设）
#
# 可选（Apple / Windows 代码签名，未配置时仍可出包；macOS 为 ad-hoc）：
#   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
#   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
#   WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD
#
# macOS 更新包默认名为 v5notes.app.tar.gz，上传前按架构改名为
#   v5notes_aarch64.app.tar.gz / v5notes_x64.app.tar.gz（及同名 .sig），
# 以便 publish-update-feed / make-latest-json.py 写入清单。
# 本工作流在三端产物齐备后生成并上传 latest.json；publish-update-feed
# 仍可用于手动重算清单。

name: Publish desktop packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "目标 Release tag（如 v2.0.2）；留空则用当前 package 版本"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: publish-desktop-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve tag and verify versions
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          tag=""
          if [ "$EVENT_NAME" = "push" ]; then
            tag="$REF_NAME"
          elif [ -n "${INPUT_TAG:-}" ]; then
            tag="$INPUT_TAG"
          else
            version="$(python3 -c "import json; print(json.load(open('v5notes-clients/v5notes-client2/src-tauri/tauri.conf.json'))['version'])")"
            tag="v${version}"
            echo "未指定 tag，使用 tauri.conf.json 版本: $tag"
          fi

          version="${tag#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "tag '$tag' 不是 v<主.次.修订> 形式。" >&2
            exit 1
          fi

          python3 - "$tag" "$version" <<'PY'
          import json
          import pathlib
          import sys

          tag, version = sys.argv[1], sys.argv[2]

          conf = json.loads(pathlib.Path("v5notes-clients/v5notes-client2/src-tauri/tauri.conf.json").read_text(encoding="utf-8"))
          package = json.loads(pathlib.Path("v5notes-clients/v5notes-client2/package.json").read_text(encoding="utf-8"))
          cargo = pathlib.Path("v5notes-clients/v5notes-client2/src-tauri/Cargo.toml").read_text(encoding="utf-8")
          cargo_version = ""
          in_package = False
          for line in cargo.splitlines():
              stripped = line.strip()
              if stripped.startswith("[") and stripped.endswith("]"):
                  in_package = stripped == "[package]"
                  continue
              if in_package and stripped.startswith("version"):
                  cargo_version = stripped.split("=", 1)[1].strip().strip('"').strip("'")
                  break

          found = {
              "tauri.conf.json": conf.get("version", ""),
              "package.json": package.get("version", ""),
              "Cargo.toml": cargo_version,
          }
          mismatched = [f"{name}={value}" for name, value in found.items() if value != version]
          if mismatched:
              print(
                  f"tag {tag} 的版本是 {version}，与仓库不一致：{', '.join(mismatched)}",
                  file=sys.stderr,
              )
              sys.exit(1)

          notes_path = pathlib.Path(f"v5notes-clients/v5notes-client2/releases/{version}.md")
          if notes_path.is_file():
              heading = next((line.strip() for line in notes_path.read_text(encoding="utf-8").splitlines() if line.strip()), "")
              if heading not in {f"# {version}", f"# v{version}"}:
                  print(f"{notes_path} 的第一行标题必须是 '# {version}'。当前是：{heading or '（空）'}", file=sys.stderr)
                  sys.exit(1)
          else:
              print(f"警告: 没有 {notes_path}，Release 说明将使用占位文案。", file=sys.stderr)

          print(f"版本核对通过：{version}")
          PY

          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Check updater signing secret
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "缺少 Secret TAURI_SIGNING_PRIVATE_KEY，无法生成带 .sig 的更新包。" >&2
            echo "在 Settings → Secrets and variables → Actions 中添加更新私钥。" >&2
            exit 1
          fi

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            artifact_key: darwin-aarch64
            updater_name: v5notes_aarch64.app.tar.gz
          - platform: macos-latest
            rust_target: x86_64-apple-darwin
            artifact_key: darwin-x86_64
            updater_name: v5notes_x64.app.tar.gz
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            artifact_key: windows-x86_64
            updater_name: ""
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: v5notes-clients/v5notes-client2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: v5notes-clients/v5notes-client2/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: v5notes-clients/v5notes-client2/src-tauri -> target
          key: desktop-${{ matrix.rust_target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Import Windows code signing certificate
        if: runner.os == 'Windows'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          if ([string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE)) {
            Write-Host "未配置 WINDOWS_CERTIFICATE，跳过 Windows 代码签名证书导入。"
            exit 0
          }
          New-Item -ItemType Directory -Force -Path certificate | Out-Null
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx
          Remove-Item certificate/tempCert.txt
          Import-PfxCertificate `
            -FilePath certificate/certificate.pfx `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText)

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 暂不注入 Apple 代码签名：仓库里的 APPLE_CERTIFICATE 不是有效 PKCS#12，
          # 会导致 security import 失败。未配置时 Tauri 使用 ad-hoc 签名仍可出包。
          # 证书修好后恢复下面几行即可。
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri -- build --target ${{ matrix.rust_target }}

      - name: Collect release assets
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
          ARTIFACT_KEY: ${{ matrix.artifact_key }}
          UPDATER_NAME: ${{ matrix.updater_name }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          out="${GITHUB_WORKSPACE}/desktop-artifacts"
          mkdir -p "$out"
          bundle="src-tauri/target/${RUST_TARGET}/release/bundle"

          if [[ "$ARTIFACT_KEY" == darwin-* ]]; then
            src_tar="${bundle}/macos/v5notes.app.tar.gz"
            if [[ ! -f "$src_tar" ]]; then
              echo "找不到 macOS 更新包: $src_tar" >&2
              find src-tauri/target/${RUST_TARGET}/release/bundle -type f -print >&2 || true
              exit 1
            fi
            if [[ ! -f "${src_tar}.sig" ]]; then
              echo "缺少 ${src_tar}.sig。确认 TAURI_SIGNING_PRIVATE_KEY 已配置且 createUpdaterArtifacts 已启用。" >&2
              exit 1
            fi
            cp "$src_tar" "${out}/${UPDATER_NAME}"
            cp "${src_tar}.sig" "${out}/${UPDATER_NAME}.sig"

            shopt -s nullglob
            for dmg in "${bundle}/dmg"/*.dmg; do
              base="$(basename "$dmg")"
              # 统一带架构后缀，避免两台 macOS job 上传同名 dmg 互相覆盖。
              if [[ "$base" != *"aarch64"* && "$base" != *"x64"* && "$base" != *"x86_64"* ]]; then
                stem="${base%.dmg}"
                if [[ "$ARTIFACT_KEY" == "darwin-aarch64" ]]; then
                  base="${stem}_aarch64.dmg"
                else
                  base="${stem}_x64.dmg"
                fi
              fi
              cp "$dmg" "${out}/${base}"
            done
          else
            shopt -s nullglob
            for f in "${bundle}/nsis"/*; do
              cp "$f" "${out}/$(basename "$f")"
            done
            for f in "${bundle}/msi"/*; do
              cp "$f" "${out}/$(basename "$f")"
            done
            if [[ ! -f "${out}/v5notes_${VERSION}_x64-setup.nsis.zip" ]]; then
              echo "找不到 Windows 更新包 v5notes_${VERSION}_x64-setup.nsis.zip" >&2
              find "src-tauri/target/${RUST_TARGET}/release/bundle" -type f -print >&2 || true
              exit 1
            fi
            if [[ ! -f "${out}/v5notes_${VERSION}_x64-setup.nsis.zip.sig" ]]; then
              echo "缺少 v5notes_${VERSION}_x64-setup.nsis.zip.sig。" >&2
              exit 1
            fi
          fi

          echo "Collected:"
          find "$out" -type f -print | sort

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.artifact_key }}
          path: desktop-artifacts/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true

      - name: List assets
        run: |
          set -euo pipefail
          find dist -type f -print | sort
          test -f dist/v5notes_aarch64.app.tar.gz
          test -f dist/v5notes_aarch64.app.tar.gz.sig
          test -f dist/v5notes_x64.app.tar.gz
          test -f dist/v5notes_x64.app.tar.gz.sig
          test -f "dist/v5notes_${{ needs.resolve.outputs.version }}_x64-setup.nsis.zip"
          test -f "dist/v5notes_${{ needs.resolve.outputs.version }}_x64-setup.nsis.zip.sig"

      - name: Prepare release notes and latest.json
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          notes="v5notes-clients/v5notes-client2/releases/${VERSION}.md"
          if [ -f "$notes" ]; then
            cp "$notes" release-notes.md
          else
            printf '%s\n' "v5notes ${VERSION}" > release-notes.md
          fi

          # Release 尚未创建时没有 publishedAt，用当前 UTC，清单只要求 RFC3339。
          published_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          python3 v5notes-clients/v5notes-client2/scripts/make-latest-json.py \
            --assets-dir dist \
            --version "$VERSION" \
            --tag "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file release-notes.md \
            --pub-date "$published_at" \
            --out dist/latest.json
          echo '--- dist/latest.json ---'
          cat dist/latest.json

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find dist -maxdepth 1 -type f -print | sort)
          if ((${#files[@]} == 0)); then
            echo "dist 里没有可上传的文件。" >&2
            exit 1
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖同名附件。"
            gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            # 一次带齐附件再发布，避免 release.published 触发的 feed 读到空 Release。
            gh release create "$TAG" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "v5notes ${VERSION}" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA"
          fi
          echo "已上传安装包、更新包与 latest.json 到 Release $TAG"
