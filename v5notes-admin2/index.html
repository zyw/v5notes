    <style>
      html, body, #app { height: 100%; margin: 0px; padding: 0px; }
      /* L0 启动舱（方向 1 · 同步进度舱）纯内联 CSS，Vue 挂载前即可渲染 */
      #boot, #boot *, #boot *::before, #boot *::after { box-sizing: border-box; }
      #boot{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;overflow:hidden;background:#f4f7f5;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','MiSans','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;color:#15241e;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;transition:opacity .34s ease,visibility .34s ease}
      #boot[data-theme='dark']{background:radial-gradient(78% 62% at 50% -6%,rgba(79,191,148,.2) 0%,rgba(79,191,148,0) 58%),linear-gradient(168deg,#1c5a48 0%,#12493c 44%,#0f3d33 74%,#092a23 100%);color:#eafff5}
      #boot.is-out{opacity:0;visibility:hidden;pointer-events:none}
      .boot-halo{position:absolute;width:820px;height:820px;border-radius:50%;border:1px solid rgba(28,90,72,.09);pointer-events:none}
      #boot[data-theme='dark'] .boot-halo{border-color:rgba(233,255,246,.07)}
      .boot-halo::after{content:'';position:absolute;inset:118px;border-radius:50%;border:1px solid rgba(28,90,72,.09)}
      #boot[data-theme='dark'] .boot-halo::after{border-color:rgba(233,255,246,.07)}
      .boot-cabin{position:relative;width:468px;max-width:calc(100vw - 40px);padding:26px 34px 22px;border-radius:22px;background:#fff;border:1px solid #e6ebe7;box-shadow:0 34px 80px -44px rgba(21,36,30,.34),0 2px 10px rgba(21,36,30,.05)}
      #boot[data-theme='dark'] .boot-cabin{background:linear-gradient(180deg,rgba(233,255,246,.075),rgba(233,255,246,.03));border-color:rgba(233,255,246,.14);box-shadow:0 44px 100px -46px rgba(0,0,0,.62),inset 0 1px 0 rgba(255,255,255,.05)}
      .boot-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:20px;border-bottom:1px solid #eef1ef}
      #boot[data-theme='dark'] .boot-head{border-bottom-color:rgba(233,255,246,.07)}
      .boot-lock{display:flex;align-items:center;gap:11px}
      .boot-logo{width:34px;height:34px;border-radius:8px;display:block}
      .boot-name{font-size:15px;font-weight:600;letter-spacing:.01em;line-height:1.2}
      .boot-sub{font-size:12px;color:#556660;margin-top:3px;letter-spacing:.02em}
      #boot[data-theme='dark'] .boot-sub{color:#a9c6ba}
      .boot-flag{font-family:'SF Mono',SFMono-Regular,ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#556660;border:1px solid #e6ebe7;border-radius:6px;padding:4px 8px;letter-spacing:.03em;white-space:nowrap}
      #boot[data-theme='dark'] .boot-flag{color:#a9c6ba;border-color:rgba(233,255,246,.11)}
      .boot-ring-wrap{position:relative;width:140px;height:140px;margin:22px auto 0}
      .boot-ring{display:block;transform:rotate(-90deg)}
      .boot-track{fill:none;stroke:#e3eae5;stroke-width:6}
      #boot[data-theme='dark'] .boot-track{stroke:rgba(233,255,246,.12)}
      .boot-bar{fill:none;stroke:#1c5a48;stroke-width:6;stroke-linecap:round;stroke-dasharray:389.56;stroke-dashoffset:389.56;filter:drop-shadow(0 0 9px rgba(28,90,72,.16))}
      #boot[data-theme='dark'] .boot-bar{stroke:#4fbf94;filter:drop-shadow(0 0 9px rgba(79,191,148,.5))}
      .boot-core{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
      .boot-num{display:flex;align-items:flex-start;gap:1px;font-family:'SF Mono',SFMono-Regular,ui-monospace,Menlo,Consolas,monospace;font-size:36px;font-weight:600;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
      .boot-sign{font-size:15px;font-weight:500;color:#556660;margin-top:4px}
      #boot[data-theme='dark'] .boot-sign{color:#a9c6ba}
      .boot-cap{font-size:12px;color:#556660;letter-spacing:.04em}
      #boot[data-theme='dark'] .boot-cap{color:#a9c6ba}
      .boot-check{position:absolute;top:50%;left:50%;width:40px;height:40px;margin:-24px 0 0 -20px;fill:none;stroke:#1c5a48;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.7);transition:opacity .3s ease,transform .3s ease}
      #boot[data-theme='dark'] .boot-check{stroke:#4fbf94}
      .boot-core.is-full .boot-num{opacity:0}
      .boot-core.is-full .boot-check{opacity:1;transform:scale(1)}
      .boot-now{text-align:center;margin-top:16px;min-height:46px}
      .boot-now-label{font-size:17px;font-weight:600;letter-spacing:.005em;line-height:1.35}
      .boot-now-detail{font-family:'SF Mono',SFMono-Regular,ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#556660;margin-top:6px;letter-spacing:.01em}
      #boot[data-theme='dark'] .boot-now-detail{color:#a9c6ba}
      .boot-cabin.is-done .boot-now-label{color:#1c5a48}
      #boot[data-theme='dark'] .boot-cabin.is-done .boot-now-label{color:#7ad9b2}
      .boot-stages{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
      #boot[data-theme='dark'] .boot-stages{border-top-color:rgba(233,255,246,.07)}
      .boot-st{display:grid;grid-template-columns:22px 18px 1fr 48px;align-items:center;gap:10px;height:42px;padding:0 12px;border-radius:10px;border:1px solid #eef1ef;background:#fff;font-size:14px;color:#5f7067;transition:background-color .28s ease,border-color .28s ease,color .28s ease}
      #boot[data-theme='dark'] .boot-st{color:#87a597;border-color:rgba(233,255,246,.09);background:transparent}
      .boot-st+.boot-st{}
      #boot[data-theme='dark'] .boot-st+.boot-st{}
      .boot-idx{font-family:'SF Mono',SFMono-Regular,ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#5f7067;font-variant-numeric:tabular-nums}
      #boot[data-theme='dark'] .boot-idx{color:#87a597}
      .boot-mark{position:relative;width:18px;height:18px;border-radius:50%;border:1.5px solid #cfdad3;display:grid;place-items:center}
      #boot[data-theme='dark'] .boot-mark{border-color:rgba(233,255,246,.26)}
      .boot-mark svg{width:11px;height:11px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.5);transition:opacity .24s ease,transform .24s ease}
      #boot[data-theme='dark'] .boot-mark svg{stroke:#06251d}
      .boot-st-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .boot-st-time{font-family:'SF Mono',SFMono-Regular,ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#5f7067;font-variant-numeric:tabular-nums;opacity:0;transition:opacity .3s ease;text-align:right;width:48px;white-space:nowrap}
      #boot[data-theme='dark'] .boot-st-time{color:#87a597}
      .boot-st.is-done{color:#556660}
      #boot[data-theme='dark'] .boot-st.is-done{color:#a9c6ba}
      .boot-st.is-done .boot-idx{color:#1c5a48}
      .boot-st.is-done .boot-mark{background:#1c5a48;border-color:#1c5a48}
      #boot[data-theme='dark'] .boot-st.is-done .boot-idx{color:#7ad9b2}
      #boot[data-theme='dark'] .boot-st.is-done .boot-mark{background:#4fbf94;border-color:#4fbf94}
      .boot-st.is-done .boot-mark svg{opacity:1;transform:scale(1)}
      .boot-st.is-done .boot-st-time{opacity:1}
      .boot-st.is-now{background:#e8f2ec;color:#15241e;border-color:#b9d6c8}
      #boot[data-theme='dark'] .boot-st.is-now{background:rgba(79,191,148,.16);color:#eafff5;border-color:rgba(79,191,148,.5)}
      .boot-st.is-now .boot-mark{border-color:#1c5a48}
      #boot[data-theme='dark'] .boot-st.is-now .boot-mark{border-color:#4fbf94}
      .boot-st.is-now .boot-mark::after{content:'';width:6px;height:6px;border-radius:50%;background:#1c5a48;animation:bootPulse 1.7s ease-in-out infinite}
      #boot[data-theme='dark'] .boot-st.is-now .boot-mark::after{background:#4fbf94}
      .boot-st.is-now .boot-st-name{font-weight:600}
      .boot-st.is-now .boot-idx{color:#1c5a48}
      #boot[data-theme='dark'] .boot-st.is-now .boot-idx{color:#7ad9b2}
      .boot-slow{display:flex;align-items:center;gap:7px;justify-content:center;height:22px;margin-top:10px;font-size:12px;color:#556660;opacity:0;transition:opacity .4s ease}
      #boot[data-theme='dark'] .boot-slow{color:#a9c6ba}
      .boot-slow.is-on{opacity:1}
      .boot-slow-dot{width:6px;height:6px;border-radius:50%;background:#d9a33b;animation:bootPulse 1.4s ease-in-out infinite}
      .boot-foot{display:flex;align-items:center;justify-content:space-between;margin-top:6px;padding-top:14px;border-top:1px solid #eef1ef}
      #boot[data-theme='dark'] .boot-foot{border-top-color:rgba(233,255,246,.07)}
      .boot-step{font-size:13px;color:#556660}
      #boot[data-theme='dark'] .boot-step{color:#a9c6ba}
      .boot-step b{font-family:'SF Mono',SFMono-Regular,ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:#15241e;font-weight:600}
      #boot[data-theme='dark'] .boot-step b{color:#eafff5}
      .boot-slash{margin:0 2px;color:#5f7067}
      .boot-elapsed{display:inline-flex;align-items:baseline;gap:2px}
      .boot-lab{font-size:12px;color:#556660}
      #boot[data-theme='dark'] .boot-lab{color:#a9c6ba}
      .boot-elapsed b{font-family:'SF Mono',SFMono-Regular,ui-monospace,Menlo,Consolas,monospace;font-size:17px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
      .boot-unit{font-size:12px;color:#556660;font-family:'SF Mono',SFMono-Regular,ui-monospace,Menlo,Consolas,monospace}
      #boot[data-theme='dark'] .boot-unit{color:#a9c6ba}
      .boot-fail{position:absolute;inset:0;display:none;place-items:center;padding:24px}
      #boot.is-fail .boot-fail{display:grid}
      #boot.is-fail .boot-cabin{display:none}
      .boot-fail-card{width:486px;max-width:calc(100vw - 40px);padding:34px 34px 24px;border-radius:20px;background:#fff;border:1px solid #e6ebe7;box-shadow:0 34px 80px -44px rgba(21,36,30,.34);text-align:left}
      #boot[data-theme='dark'] .boot-fail-card{background:linear-gradient(180deg,rgba(233,255,246,.075),rgba(233,255,246,.03));border-color:rgba(233,255,246,.14);box-shadow:0 44px 100px -46px rgba(0,0,0,.62)}
      .boot-fail-icon{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:#fbf2e0;color:#8a6410}
      #boot[data-theme='dark'] .boot-fail-icon{background:rgba(217,163,59,.14);color:#e6be6d}
      .boot-fail-icon svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
      .boot-fail-eyebrow{margin-top:20px;font-family:'SF Mono',SFMono-Regular,ui-monospace,Menlo,Consolas,monospace;font-size:12px;letter-spacing:.06em;color:#8a6410}
      #boot[data-theme='dark'] .boot-fail-eyebrow{color:#e6be6d}
      .boot-fail-title{margin:8px 0 0;font-size:22px;font-weight:600;letter-spacing:-.01em;line-height:1.35;color:#8a6410}
      #boot[data-theme='dark'] .boot-fail-title{color:#e6be6d}
      .boot-fail-body{margin:12px 0 0;font-size:14px;line-height:1.75;color:#556660}
      #boot[data-theme='dark'] .boot-fail-body{color:#a9c6ba}
      .boot-fail-actions{display:flex;gap:10px;margin-top:24px}
      .boot-btn-primary,.boot-btn-ghost{appearance:none;font:inherit;font-size:14px;height:40px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;padding:0 20px}
      .boot-btn-primary{border:0;background:#1c5a48;color:#fff;font-weight:600}
      #boot[data-theme='dark'] .boot-btn-primary{background:#4fbf94;color:#06251d}
      .boot-btn-ghost{border:1px solid #e6ebe7;background:transparent;color:#556660}
      #boot[data-theme='dark'] .boot-btn-ghost{border-color:rgba(233,255,246,.14);color:#a9c6ba}
      .boot-fail-foot{margin-top:22px;padding-top:16px;border-top:1px solid #eef1ef;font-size:12px;color:#5f7067}
      #boot[data-theme='dark'] .boot-fail-foot{border-top-color:rgba(233,255,246,.07);color:#87a597}
      @keyframes bootPulse{0%,100%{opacity:.35;transform:scale(.75)}50%{opacity:1;transform:scale(1)}}
      @media (prefers-reduced-motion: reduce){.boot-st.is-now .boot-mark::after,.boot-slow-dot{animation:none}#boot,.boot-bar,.boot-check,.boot-st,.boot-st-time{transition:none}}
    </style>
  </head>

  <body>
    <div id="boot" role="status" aria-live="polite" aria-label="正在加载 V5Notes2 管理控制台" data-theme="light">
      <div class="boot-halo" aria-hidden="true"></div>
      <div class="boot-cabin" id="bootCabin">
        <div class="boot-head">
          <div class="boot-lock">
            <img class="boot-logo" id="bootLogo" alt="" />
            <div>
              <div class="boot-name">V5Notes2</div>
              <div class="boot-sub">云笔记 · 管理控制台</div>
            </div>
          </div>
          <span class="boot-flag" id="bootFlag">冷启动</span>
        </div>
        <div class="boot-ring-wrap">
          <svg class="boot-ring" width="140" height="140" viewBox="0 0 140 140" aria-hidden="true">
            <circle class="boot-track" cx="70" cy="70" r="62"></circle>
            <circle class="boot-bar" id="bootBar" cx="70" cy="70" r="62"></circle>
          </svg>
          <div class="boot-core" id="bootCore">
            <div class="boot-num"><span id="bootPct">0</span><span class="boot-sign">%</span></div>
            <svg class="boot-check" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.6l4.6 4.6L19 7.4" /></svg>
            <div class="boot-cap" id="bootCap">已载入</div>
          </div>
        </div>
        <div class="boot-now">
          <div class="boot-now-label" id="bootNow">解析页面骨架</div>
          <div class="boot-now-detail" id="bootDetail">document.readyState · interactive</div>
        </div>
        <ul class="boot-stages" id="bootStages"></ul>
        <div class="boot-slow" id="bootSlow"><span class="boot-slow-dot"></span>网络似乎较慢，仍在重试…</div>
        <div class="boot-foot">
          <span class="boot-step">步骤 <b id="bootStep">1</b><span class="boot-slash">/</span>5</span>
          <span class="boot-elapsed"><span class="boot-lab">已用</span><b id="bootElapsed">0.0</b><span class="boot-unit">s</span></span>
        </div>
      </div>
      <div class="boot-fail">
        <div class="boot-fail-card">
          <div class="boot-fail-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.4" /><path d="M12 7.4V12l3 1.8" /></svg></div>
          <div class="boot-fail-eyebrow" id="bootFailCode">8.0s · 超时</div>
          <h2 class="boot-fail-title" id="bootFailTitle">加载时间超出预期</h2>
          <p class="boot-fail-body" id="bootFailBody">应用在 8 秒内没有完成启动。重新加载不会从头再来，通常再试一次即可。</p>
          <div class="boot-fail-actions">
            <button class="boot-btn-primary" type="button" id="bootFailReload">重新加载</button>
            <button class="boot-btn-ghost" type="button" id="bootFailDiag">查看网络诊断</button>
          </div>
          <div class="boot-fail-foot" id="bootFailFoot">已保留：页面骨架 · 已完成的阶段</div>
        </div>
      </div>
    </div>

    <div id="app"></div>

        // 统一启动屏：登录页刷新与登录后刷新都使用同一套浅色加载样式
        var dark = false;
        root.setAttribute('data-theme', 'light');

        var rows = [];
        (function build() {
          var tick = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.6 8.4l2.9 2.9 5.9-5.9"/></svg>';
          for (var i = 0; i < TOTAL; i++) {
            var li = document.createElement('li');
            li.className = 'boot-st';
            li.innerHTML =
              '<span class="boot-idx">0' + (i + 1) + '</span>' +
              '<span class="boot-mark">' + tick + '</span>' +
              '<span class="boot-st-name">' + STAGES[i].label + '</span>' +
              '<span class="boot-st-time"></span>';
            stagesEl.appendChild(li);
            rows.push(li);
          }
        })();

        var t0 = performance.now();
        var completed = 0;
        var active = 0;
        var targetPct = 0;
        var shownPct = 0;
        var isDone = false;
        var isFail = false;
        var raf = 0;
        var elapsedTimer = 0;
        var watchdog = 0;

        function setRow(i, state) {
          var r = rows[i];
          if (!r) return;
          r.classList.toggle('is-done', state === 'done');
          r.classList.toggle('is-now', state === 'now');
        }
        function rowTime(i, text) {
          var t = rows[i].querySelector('.boot-st-time');
          if (t) t.textContent = text;
        }
        function paintRows() {
          for (var i = 0; i < TOTAL; i++) {
            if (i < completed) setRow(i, 'done');
            else if (i === active && !isDone) setRow(i, 'now');
            else setRow(i, '');
          }
          stepEl.textContent = String(Math.min(TOTAL, completed + 1));
          if (active < TOTAL) {
            nowEl.textContent = STAGES[active].label;
            detailEl.textContent = STAGES[active].detail;
          }
        }
        function ease() {
          shownPct += (targetPct - shownPct) * 0.16;
          if (targetPct - shownPct < 0.15) shownPct = targetPct;
          bar.style.strokeDashoffset = String(CIRC * (1 - shownPct / 100));
          pctEl.textContent = String(Math.round(shownPct));
          if (Math.abs(targetPct - shownPct) > 0.1) raf = requestAnimationFrame(ease);
          else raf = 0;
        }
        function setTarget(p) {
          targetPct = p;
          if (!raf) raf = requestAnimationFrame(ease);
        }
        function tickElapsed() {
          if (isDone || isFail) return;
          var el = (performance.now() - t0) / 1000;
          elapsedEl.textContent = el.toFixed(1);
          if (el > 3.6) slowEl.classList.add('is-on');
        }
        function setStage(n) {
          if (isDone) return;
          // 超时只是“暂时没等到”，后续阶段真实到达说明在继续加载，回到正常流程
          if (isFail) {
            isFail = false;
            root.classList.remove('is-fail');
          }
          if (n + 1 <= completed) return;
          var now = (performance.now() - t0) / 1000;
          completed = Math.min(TOTAL, n + 1);
          active = Math.min(TOTAL - 1, completed);
          setRow(n, 'done');
          rowTime(n, now.toFixed(1) + 's');
          paintRows();
          setTarget((completed / TOTAL) * 100);
        }
        function done() {
          if (isDone) return;
          // 若此前 8s 超时把页面切到了失败面，但应用随后其实加载成功了，这里要撤销失败面并正常收口
          if (isFail) {
            isFail = false;
            root.classList.remove('is-fail');
          }
          isDone = true;
          clearInterval(elapsedTimer);
          clearTimeout(watchdog);
          completed = TOTAL;
          for (var i = 0; i < TOTAL; i++) setRow(i, 'done');
          stepEl.textContent = String(TOTAL);
          nowEl.textContent = '工作台已就绪';
          detailEl.textContent = '5 个阶段已完成 · 正在进入';
          elapsedEl.textContent = ((performance.now() - t0) / 1000).toFixed(1);
          slowEl.classList.remove('is-on');
          flagEl.textContent = '已就绪';
          capEl.textContent = '已完成';
          cabin.classList.add('is-done');
          setTarget(100);
          // 稳健收口：不依赖 rAF 是否被节流；给环形 180ms 收敛，再淡出移除
          var finalized = false;
          function finalize() {
            if (finalized) return;
            finalized = true;
            shownPct = 100;
            bar.style.strokeDashoffset = '0';
            pctEl.textContent = '100';
            core.classList.add('is-full');
            setTimeout(function () {
              root.classList.add('is-out');
              setTimeout(function () {
                if (root && root.parentNode) root.parentNode.removeChild(root);
              }, 400);
            }, 220);
          }
          setTimeout(finalize, 220);   // 正常路径
          setTimeout(finalize, 1600);  // 硬兜底：即使 rAF 被完全暂停也必定移除
        }
        var FAILS = {
          timeout: { code: '8.0s · 超时', title: '加载时间超出预期', body: '应用在 8 秒内没有完成启动。重新加载不会从头再来，通常再试一次即可。', foot: '已保留：页面骨架 · 已完成的阶段' },
          session: { code: '401 · UNAUTHORIZED', title: '会话已过期，请重新登录', body: '登录凭证已失效。重新加载后会回到登录页。', foot: '已保留：当前页面地址' },
          '502': { code: '502 · BAD GATEWAY', title: '服务暂时不可用（502）', body: '网关没能连上笔记服务（v5notes-api）。稍后重试即可。', foot: '已保留：页面骨架' }
        };
        function fail(kind) {
          if (isDone) return;
          isFail = true;
          clearInterval(elapsedTimer);
          clearTimeout(watchdog);
          var f = FAILS[kind] || FAILS.timeout;
          document.getElementById('bootFailCode').textContent = f.code;
          document.getElementById('bootFailTitle').textContent = f.title;
          document.getElementById('bootFailBody').textContent = f.body;
          document.getElementById('bootFailFoot').textContent = f.foot;
          root.classList.add('is-fail');
        }
        document.getElementById('bootFailReload').addEventListener('click', function () { window.location.reload(); });
        document.getElementById('bootFailDiag').addEventListener('click', function () { window.location.reload(); });

        window.v5Boot = {
          setStage: setStage,
          done: done,
          fail: fail,
          scriptLoaded: function () { setStage(1); }
        };

        paintRows();
        setTarget(4);
        elapsedTimer = setInterval(tickElapsed, 100);
        watchdog = setTimeout(function () { fail('timeout'); }, 8000);
      })();
    </script>
