<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>用户弹窗设计</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%}body{font-family:'MiSans','HarmonyOS Sans SC','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;background:#eef1f5;color:#1f2937;-webkit-font-smoothing:antialiased}
.app-shell{position:fixed;inset:0;display:grid;grid-template-columns:236px 1fr;filter:saturate(.7)}
.rail{background:#fff;border-right:1px solid #e7eaf0;padding:22px 16px}.rail .brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px;font-weight:700;color:#14532d;font-size:15px}.rail .brand img{width:28px;height:28px;border-radius:7px}.rail .item{height:38px;border-radius:8px;display:flex;align-items:center;gap:10px;padding:0 10px;color:#5b6472;font-size:13px;margin-bottom:4px}.rail .item.on{background:#eef4ff;color:#2563eb;font-weight:600}.rail .bar{height:8px;border-radius:999px;background:#eef0f4;margin:14px 10px}.rail .bar.s{width:62%}.canvas{padding:26px 30px}.topbar{height:54px;display:flex;align-items:center;justify-content:space-between}.topbar .search{width:280px;height:36px;border-radius:9px;background:#fff;border:1px solid #e7eaf0}.topbar .avatar{width:34px;height:34px;border-radius:50%;background:#dbeafe}.table-card{margin-top:18px;background:#fff;border:1px solid #e7eaf0;border-radius:12px;padding:22px}.table-title{width:180px;height:16px;background:#e8ebf1;border-radius:6px;margin-bottom:18px}.row-line{height:44px;border-bottom:1px solid #f0f2f6;display:flex;align-items:center;gap:24px}.pill{height:10px;border-radius:6px;background:#eceff4}.pill.w1{width:120px}.pill.w2{width:90px}.pill.w3{width:160px}.pill.w4{width:70px}.scrim{position:fixed;inset:0;background:rgba(17,24,39,.42);backdrop-filter:blur(1.2px)}

.drawer{position:fixed;top:0;right:0;height:100%;width:610px;background:#fff;box-shadow:-20px 0 60px rgba(15,23,42,.28);display:flex;flex-direction:column;overflow:hidden}
.hero{position:relative;background:linear-gradient(148deg,#0f3d33 0%,#1c5a48 70%,#256a55 100%);padding:26px 30px 26px;color:#fff;overflow:hidden}
.hero::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-90px;top:-130px;background:rgba(255,255,255,.07)}
.hero-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.wordmark{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;letter-spacing:.02em;color:#dff1e8}.wordmark img{width:22px;height:22px;border-radius:6px}
.dclose{width:34px;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;display:grid;place-items:center;cursor:pointer}
.profile{display:flex;align-items:center;gap:16px;margin-top:28px;position:relative;z-index:1}
.pavatar{width:64px;height:64px;border-radius:18px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;font-size:24px;font-weight:700}
.pname{font-size:22px;font-weight:700;letter-spacing:-.01em;margin-bottom:7px}
.pmeta{display:flex;align-items:center;gap:8px;font-size:12px;color:#c9e4d7}.tag{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:4px 9px;font-size:11.5px;font-weight:700;color:#eafff5}
.body{flex:1;overflow:auto;padding:24px 30px 20px;background:#fbfcfb}
.section{padding:0 0 20px;margin-bottom:2px;border-bottom:1px solid #edf0ef}.section:last-child{border-bottom:0}
.section h4{font-size:12px;font-weight:800;letter-spacing:.06em;color:#6b7d74;margin:0 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.f{display:flex;flex-direction:column;gap:7px;min-width:0}.f.full{grid-column:1/-1}
.f label{font-size:12.5px;font-weight:600;color:#3f4a44}.req{color:#d9534f;margin-right:2px}
.input,.select{height:43px;border:1px solid #dfe5e1;border-radius:10px;background:#fff;display:flex;align-items:center;padding:0 12px;font-size:14px;color:#1f2937;transition:.15s}
.select{justify-content:space-between}.muted{color:#a0aaa4}
.input.area{height:86px;align-items:flex-start;padding-top:11px;line-height:1.6}
.chips{min-height:43px;border:1px solid #dfe5e1;border-radius:10px;background:#fff;display:flex;align-items:center;gap:8px;padding:5px 9px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:#edf5f0;color:#25594a;border-radius:7px;padding:4px 8px;font-size:12.5px;font-weight:700}.chip .x{color:#80a798}
.statusline{display:flex;align-items:center;gap:16px;height:43px}.rad{width:15px;height:15px;border-radius:50%;border:1.5px solid #d5ddd8;display:inline-block}.rad.on{border-color:#2f6b57;background:radial-gradient(circle at center,#2f6b57 0 45%,#fff 50%)}
.foot{flex:none;display:flex;align-items:center;justify-content:space-between;padding:16px 30px 18px;border-top:1px solid #e9ecea;background:#fff}
.hint{font-size:12px;color:#94a29a;display:flex;align-items:center;gap:6px}.hint::before{content:"";width:6px;height:6px;border-radius:50%;background:#e0a93b}
.actions{display:flex;gap:10px}
.btn{height:41px;min-width:94px;border-radius:10px;font-size:14px;font-weight:600;border:1px solid transparent;cursor:pointer}
.btn.ghost{background:#fff;border-color:#dfe5e1;color:#4b5563}.btn.primary{background:#1c5a48;color:#fff;box-shadow:0 8px 20px rgba(28,90,72,.28)}
</style></head><body>
