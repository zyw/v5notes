<!doctype html>
    <html lang="zh-CN">
    <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <meta name="theme-color" content="#f4f7f5" />
      <title>V5Notes2 云笔记 · 登录</title>
      <style>
:root{
  --shell:#f4f7f5;--surface:#fff;--surface-2:#f8faf9;--line:#e6ebe7;--line-strong:#d8e2db;
  --ink:#15241e;--body:#2b3a32;--muted:#5f7067;--soft:#e8f2ec;--soft-2:#f0f5f2;
  --green:#1c5a48;--green-dark:#0f3d33;--green-hover:#236a55;--orange:#f97316;
  --radius:12px;--shadow:0 18px 50px rgba(20,40,30,.09);
  --font:"MiSans","HarmonyOS Sans SC","PingFang SC","Noto Sans SC",sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{font-family:var(--font);color:var(--body);background:var(--shell);font-size:16px;line-height:1.5}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid rgba(28,90,72,.26);outline-offset:2px}
a{color:inherit;text-decoration:none}
.page{min-height:100vh;position:relative;overflow:hidden}
.topbar{height:82px;display:flex;align-items:center;justify-content:space-between;padding:0 56px;position:relative;z-index:4}
.brand{display:flex;align-items:center;gap:12px;color:var(--ink);font-weight:650;font-size:16px;letter-spacing:.01em}
.brand-mark{width:42px;height:42px;object-fit:contain;border-radius:11px}
.brand-text{display:flex;flex-direction:column;line-height:1.25}
.brand-text small{font-size:12px;color:var(--muted);font-weight:450;margin-top:3px}
.language{height:42px;min-width:104px;border:1px solid var(--line);background:rgba(255,255,255,.72);border-radius:9px;color:var(--body);font-size:13px;padding:0 13px;display:flex;gap:10px;align-items:center;justify-content:center}
.language svg{width:13px;height:13px}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:34px}
.card-head{margin-bottom:25px}
.eyebrow{font:600 12px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;color:var(--green);text-transform:uppercase;margin:0 0 12px}
.card-head h1{font-size:27px;line-height:1.25;letter-spacing:0;margin:0;color:var(--ink);font-weight:650}
.card-head p{font-size:14px;color:var(--muted);margin:8px 0 0;line-height:1.65}
.field{margin:0 0 16px}
.field label{display:block;color:var(--body);font-size:13px;font-weight:600;margin:0 0 7px}
.control{height:48px;width:100%;border:1px solid var(--line-strong);border-radius:9px;background:#fff;color:var(--ink);padding:0 13px;transition:border-color .18s,box-shadow .18s}
.control::placeholder{color:#829087}
.control:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(28,90,72,.1)}
.control[aria-invalid="true"]{border-color:#b4534b;box-shadow:0 0 0 3px rgba(180,83,75,.1)}
.input-wrap{position:relative}
.input-wrap .control{padding-right:48px}
.reveal{position:absolute;top:3px;right:3px;width:42px;height:42px;border:0;background:transparent;color:var(--muted);border-radius:7px;display:grid;place-items:center}
.reveal:hover{background:var(--soft-2);color:var(--green)}
.reveal svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7}
.captcha-row{display:grid;grid-template-columns:minmax(0,1fr) 126px;gap:10px}
.captcha-art{height:48px;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface-2);color:var(--green-dark);display:flex;align-items:center;justify-content:center;gap:5px;position:relative;overflow:hidden;cursor:pointer;font:italic 700 20px/1 Georgia,serif;letter-spacing:.09em;user-select:none}
.captcha-art:before,.captcha-art:after{content:"";position:absolute;height:1px;width:120%;background:rgba(28,90,72,.22);transform:rotate(-8deg)}
.captcha-art:before{top:14px;left:-8px}.captcha-art:after{bottom:11px;left:1px;transform:rotate(5deg)}
.captcha-art span:nth-child(2){transform:rotate(8deg);color:#668579}.captcha-art span:nth-child(3){transform:rotate(-9deg);color:#335f51}.captcha-art span:nth-child(4){transform:rotate(5deg);color:#9a7c53}
.captcha-help{display:flex;justify-content:flex-end;color:var(--muted);font-size:12px;margin-top:6px}
.captcha-help button{border:0;background:none;padding:0;color:var(--green);font-size:12px}
.form-meta{display:flex;align-items:center;justify-content:space-between;margin:3px 0 19px;min-height:24px}
.remember{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--body);cursor:pointer;min-height:30px}
.remember input{width:16px;height:16px;accent-color:var(--green);margin:0}
.primary{height:48px;width:100%;border:1px solid var(--green);border-radius:9px;background:var(--green);color:#fff;font-size:15px;font-weight:650;transition:background .18s,transform .18s,box-shadow .18s;box-shadow:0 7px 16px rgba(28,90,72,.16)}
.primary:hover{background:var(--green-hover);box-shadow:0 9px 19px rgba(28,90,72,.22)}
.primary:active{transform:translateY(1px)}
.status{min-height:20px;margin:9px 0 0;font-size:12px;color:#8a4b35}
.divider{display:flex;align-items:center;gap:12px;margin:22px 0 13px;color:#6d7b73;font-size:12px}
.divider:before,.divider:after{content:"";height:1px;flex:1;background:var(--line)}
.socials{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.social{min-width:0;height:58px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;transition:background .15s,border-color .15s}
.social:hover{background:var(--soft-2);border-color:#c9d9cf}
.social img{width:18px;height:18px;object-fit:contain}
.footer{position:absolute;z-index:4;bottom:22px;left:0;right:0;text-align:center;color:#75847b;font-size:12px}
.demo-note{font-size:11px;color:#7b8981;text-align:center;margin:18px 0 0}
[hidden]{display:none!important}
@media(max-width:760px){
  .topbar{height:72px;padding:0 20px}
  .brand-mark{width:38px;height:38px}
  .brand{font-size:15px}
  .footer{position:static;padding:22px 16px 18px}
  .login-card{padding:27px 22px;border-radius:14px}
  .card-head h1{font-size:25px}
  .socials{gap:6px}
  .social{height:54px;font-size:12px}
}
@media(max-width:390px){
  .topbar{padding:0 16px}
  .language{min-width:90px;height:40px}
  .login-card{padding:24px 18px}
  .captcha-row{grid-template-columns:minmax(0,1fr) 112px}
  .socials{gap:4px}
  .social{font-size:12px}
}

    remember:"记住账号",submit:"登录",or:"或使用以下方式登录",social:"第三方登录",
    required:"请填写账号、密码和验证码。",demo:"这是登录页交互原型，未连接认证服务。",
    socialDemo:"第三方登录入口仅作交互示意。"
  },
  en:{
    lang:"English",greeting:"Welcome back",intro:"Sign in to the V5Notes2 notes console.",
    account:"Account",accountPlaceholder:"Enter your account",password:"Password",passwordPlaceholder:"Enter your password",
    captcha:"Verification code",captchaPlaceholder:"Enter the code",changeCaptcha:"Refresh code",
    remember:"Remember account",submit:"Sign in",or:"Or use another sign-in method",social:"Other sign-in methods",
    required:"Enter your account, password, and verification code.",demo:"This is an interactive design preview; authentication is not connected.",
    socialDemo:"Third-party sign-in is shown for preview only."
  }
};
let locale="zh";
const byId=(id)=>document.getElementById(id);
function setLocale(next){
  locale=next;
  document.documentElement.lang=next==="zh"?"zh-CN":"en";
  document.querySelectorAll("[data-i18n]").forEach((el)=>{
    const key=el.getAttribute("data-i18n");
    if(localeText[locale][key]) el.textContent=localeText[locale][key];
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach((el)=>{
    const key=el.getAttribute("data-i18n-placeholder");
    el.placeholder=localeText[locale][key];
  });
  byId("language-label").textContent=localeText[locale].lang;
  byId("status").textContent="";
}
byId("language").addEventListener("click",()=>setLocale(locale==="zh"?"en":"zh"));
byId("password-toggle").addEventListener("click",()=>{
  const input=byId("password");
  const show=input.type==="password";
  input.type=show?"text":"password";
  byId("password-toggle").setAttribute("aria-label",show?"Hide password":"Show password");
});
function newCode(){
  const alphabet="23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
  const code=Array.from({length:4},()=>alphabet[Math.floor(Math.random()*alphabet.length)]);
  byId("captcha-code").innerHTML=code.map((letter)=>"<span>"+letter+"</span>").join("");
}
byId("captcha-refresh").addEventListener("click",newCode);
byId("captcha-code").addEventListener("click",newCode);
document.querySelectorAll("[data-provider]").forEach((button)=>{
  button.addEventListener("click",()=>{byId("status").textContent=localeText[locale].socialDemo;});
});
byId("login-form").addEventListener("submit",(event)=>{
  event.preventDefault();
  const required=["account","password","captcha-input"];
  const missing=required.some((id)=>!byId(id).value.trim());
  byId("status").textContent=missing?localeText[locale].required:localeText[locale].demo;
  required.forEach((id)=>byId(id).setAttribute("aria-invalid",byId(id).value.trim()?"false":"true"));
});
newCode();
</script>
