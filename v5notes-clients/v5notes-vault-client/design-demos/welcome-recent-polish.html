<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WelcomeView 美化效果图</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=DM+Sans:wght@400;500;650;700&display=swap" rel="stylesheet" />
<style>
/* ============ tokens (取自 src/styles/tokens.css default light) ============ */
:root {
  --bg: #f3efe4;
  --panel: #fbf7ee;
  --ink: #2a2924;
  --muted: #7a7368;
  --line: #d8d0c4;
  --accent: #2f5b48;
  --danger: #8a3b2e;
  --danger-bg: #f0e0da;
  --surface: #ebe4d4;
  --font-display: 'Noto Serif SC', 'Songti SC', serif;
  --font-ui: 'DM Sans', 'PingFang SC', sans-serif;
  --radius-lg: 12px;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--font-display);
  color: var(--ink);
  background:
    radial-gradient(1200px 500px at 10% -10%, #e8e2d4 0%, transparent 55%),
    radial-gradient(900px 420px at 100% 0%, #efe9db 0%, transparent 50%),
    var(--bg);
  display: grid;
  place-items: center;
  padding: 48px 24px;
}

.welcome-a {
  width: min(640px, 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: 0.02em; margin: 0; }
.welcome-lede {
  font-family: var(--font-ui);
  font-size: 0.86rem;
  line-height: 1.6;
  color: var(--muted);
  margin: 12px 0 0;
  max-width: 46ch;
}

/* —— 修改点 3：网盘提示改为小警示条，并入 lede 之后 —— */
.welcome-hint {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  margin-top: 14px;
  padding: 6px 12px;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--danger) 22%, var(--line));
  background: color-mix(in srgb, var(--danger-bg) 55%, var(--panel));
  font-family: var(--font-ui);
  font-size: 0.74rem;
  color: color-mix(in srgb, var(--danger) 80%, var(--ink));
}
.welcome-hint svg { width: 13px; height: 13px; flex: none; }

/* ============ 动作栈 ============ */
.welcome-action-stack {
  list-style: none;
  margin: clamp(20px, 4vh, 36px) 0 0;   /* —— 修改点 1：间距随视口呼吸 —— */
  padding: 0;
  display: grid;
  gap: 14px;
  width: 100%;
  text-align: left;
}
.welcome-action-stack li { display: grid; gap: 6px; }
.welcome-action-stack li > span {
  font-family: var(--font-ui);
  font-size: 0.78rem;
  color: var(--muted);
  padding-left: 2px;
}
button { font: inherit; cursor: pointer; }
.welcome-cta {
  width: 100%;
  min-height: 44px;
  border-radius: 8px;
  font-family: var(--font-ui);
  font-size: 0.98rem;
  font-weight: 650;
  letter-spacing: -0.01em;
  border: none;
}
.welcome-cta.primary { color: var(--panel); background: var(--ink); }
.welcome-cta.ghost {
  border: 1px solid color-mix(in srgb, var(--line) 78%, var(--bg));  /* —— 修改点 4：幽灵边框再淡一档 —— */
  background: var(--panel);
  color: var(--ink);
}

/* ============ 最近 ============ */
.welcome-recent {
  margin-top: clamp(22px, 4.5vh, 40px);
  width: 100%;
  text-align: left;
}
.welcome-recent-label {
  margin: 0 0 10px;
  font-family: var(--font-ui);
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}
.welcome-recent-row { display: flex; flex-wrap: wrap; gap: 10px; }

.welcome-recent-chip {
  --chip-color: var(--accent);
  position: relative;
  display: inline-grid;
  grid-template-columns: 8px minmax(0, 1fr);
  gap: 12px;
  align-items: center;
  min-width: 168px;                      /* —— 修改点 4：卡片宽度整齐 —— */
  padding: 12px 44px 12px 14px;
  border-radius: var(--radius-lg);
  border: 1px solid color-mix(in srgb, var(--chip-color) 26%, var(--line));
  background: linear-gradient(135deg,
    color-mix(in srgb, var(--chip-color) 12%, var(--panel)) 0%,
    var(--panel) 58%);
  font-family: var(--font-ui);
  text-align: left;
  transition: transform 140ms ease, border-color 140ms ease, box-shadow 140ms ease;
}
.welcome-recent-chip:hover {
  transform: translateY(-2px);
  border-color: color-mix(in srgb, var(--chip-color) 55%, var(--line));
  box-shadow: 0 8px 18px rgba(42, 41, 36, 0.12);
}
.chip-swatch {
  width: 8px; height: 38px;
  border-radius: 999px;
  background: var(--chip-color);
}
.chip-copy { min-width: 0; display: grid; gap: 2px; }
.chip-copy strong {
  font-size: 0.9rem; font-weight: 650;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.chip-copy em {
  font-style: normal; font-size: 0.7rem;
  color: color-mix(in srgb, var(--chip-color) 55%, var(--muted));
}
.chip-forget {
  position: absolute; top: 5px; right: 5px;
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 50%;
  color: var(--muted); opacity: 0; transform: scale(0.8);
  transition: opacity 120ms ease, transform 120ms ease, background 120ms ease, color 120ms ease;
}
.chip-forget svg { width: 12px; height: 12px; }
.welcome-recent-chip:hover .chip-forget { opacity: 1; transform: none; }
.chip-forget:hover { background: var(--danger-bg); color: var(--danger); }

/* ============ 节气色轨 ============
   —— 修改点 2：块间加间隙；文字按底色深浅换色；选中态描边 + 勾标 —— */
.term-rail {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 6px;                               /* 原 4px，且现在成「一排」而非整块 */
  margin: clamp(22px, 4.5vh, 40px) 0 0;
  align-items: end;
  min-height: 68px;
  width: 100%;
}
.term-swatch {
  position: relative;
  display: flex; flex-direction: column; justify-content: flex-end; gap: 2px;
  min-height: 48px;
  padding: 8px 8px 7px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: var(--swatch);
  text-align: left;
  transition: min-height 140ms ease, transform 140ms ease, box-shadow 140ms ease, border-color 140ms ease;
}
/* 深底白字 / 浅底墨字（按 WCAG 对比度粗分） */
.term-swatch { color: #fffefa; }
.term-swatch[data-light='true'] { color: var(--ink); }
.term-name { font-family: var(--font-ui); font-size: 0.72rem; font-weight: 650; }
.term-color { font-family: var(--font-ui); font-size: 0.6rem; opacity: 0.85; }

.term-swatch:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(42, 41, 36, 0.16); }

/* 选中态：抬升 + 主题 accent 描边环 + 右上角勾标，不再只靠高度差 */
.term-swatch.active {
  min-height: 68px;
  z-index: 1;
  transform: translateY(-2px);
  border-color: var(--accent);
  outline: 2px solid color-mix(in srgb, var(--accent) 35%, transparent);
  outline-offset: 2px;
  box-shadow: 0 8px 18px rgba(42, 41, 36, 0.18);
}
.term-swatch.active::after {
  content: '';
  position: absolute; top: 6px; right: 6px;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--accent) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12"><path d="M2.5 6.2 5 8.6l4.5-5" fill="none" stroke="%23fbf7ee" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>') center / 10px no-repeat;
}
<link rel="preconnect" href="http://localhost:1421" />
<a class="dev-link" href="http://localhost:1421/" target="_blank" rel="noreferrer">查看真实应用（dev server）→</a>
<style>
.dev-link {
  position: fixed; top: 10px; right: 14px; z-index: 9;
  font-family: var(--font-ui); font-size: 0.7rem; color: var(--muted);
  text-decoration: none; border: 1px solid var(--line); border-radius: 999px;
  padding: 4px 10px; background: var(--panel);
}
.dev-link:hover { color: var(--accent); border-color: var(--accent); }
@media (min-width: 980px) {
  body { display: block; padding: 0; overflow: hidden; }

  .welcome-a {
    height: calc(100vh - 246px);
    width: min(640px, 100%);
    margin: 0 auto;
    justify-content: center;   /* 修改点 1：垂直居中 + clamp 间距 */
    overflow: auto;
  }

  .welcome-preview {
    height: 246px;
    border-top: 1px solid var(--line);
    background: color-mix(in srgb, var(--bg) 88%, var(--panel));
    display: flex;
    align-items: center;
    justify-content: center;
    padding-bottom: 18px;
  }

  /* —— 简化工作区预览（真实实现见 WelcomeView.vue）—— */
  .pv-shell {
    width: min(720px, 92%);
    height: 200px;
    display: grid;
    grid-template-columns: 172px minmax(0, 1fr) 120px;
    border-radius: 10px;
    border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--line));
    background: #fffefa;
    box-shadow: 0 18px 44px rgba(36, 53, 44, 0.10);
    overflow: hidden;
    font-family: var(--font-ui);
  }
  .pv-side { background: color-mix(in srgb, #8a3b2e 6%, #f5f6f1); padding: 10px; display: grid; align-content: start; gap: 6px; }
  .pv-brand { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 0.72rem; color: #2f4f3e; }
  .pv-brand i { width: 14px; height: 14px; border-radius: 4px; background: linear-gradient(135deg, #c96f33, #8a3b2e); }
  .pv-item { font-size: 0.68rem; color: #39473d; padding: 3px 6px; border-radius: 5px; }
  .pv-item.on { background: color-mix(in srgb, #8a3b2e 14%, #fffefa); font-weight: 650; }
  .pv-main { padding: 10px 14px; border-left: 1px solid #e4e6df; }
  .pv-bar { display: flex; align-items: center; gap: 8px; font-size: 0.66rem; color: #718077; }
  .pv-bar strong { color: #39473d; font-size: 0.7rem; }
  .pv-edit { margin-left: auto; background: var(--accent); color: #fbf7ee; font-size: 0.6rem; padding: 3px 8px; border-radius: 999px; }
  .pv-h { margin: 12px 0 4px; font-family: var(--font-display); font-size: 0.95rem; font-weight: 700; color: color-mix(in srgb, #8a3b2e 50%, #2a2924); border-left: 3px solid #9aab8c; padding-left: 8px; }
  .pv-p { margin: 0; font-size: 0.66rem; color: #7a7368; }
  .pv-out { border-left: 1px solid #e4e6df; background: #f5f6f1; padding: 10px; font-size: 0.64rem; color: #718077; display: grid; align-content: start; gap: 6px; }
}
</style>
</head>
<body>
  <section class="welcome-a">
    <div>
      <h1>选一个库色，再打开文件夹</h1>
      <p class="welcome-lede">本地文件夹是权威；库色是身份条，不是皮肤。Cloud 与 Vault 默认不是同一份数据。</p>
      <p class="welcome-hint">
        <svg viewBox="0 0 16 16" fill="none"><path d="M8 1.8 14.6 13H1.4L8 1.8Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M8 6.2v3M8 11.4v.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        请勿把库放进网盘同步目录后再开官方 Sync
      </p>
    </div>

    <ul class="welcome-action-stack">
      <li>
        <button class="welcome-cta primary">创建新库</button>
        <span>选父目录并命名，写入 <code>.v5notes</code> 骨架</span>
      </li>
      <li>
        <button class="welcome-cta ghost">打开已有库</button>
        <span>选择含 <code>vault.json</code> 的根目录</span>
      </li>
      <li>
        <button class="welcome-cta ghost">使用默认库</button>
        <span>应用数据目录中的默认库</span>
      </li>
    </ul>

    <div class="welcome-recent">
      <p class="welcome-recent-label">最近</p>
      <div class="welcome-recent-row">
        <button class="welcome-recent-chip" style="--chip-color:#93a884">
          <span class="chip-swatch"></span>
          <span class="chip-copy"><strong>MyVault</strong><em>谷雨</em></span>
          <span class="chip-forget"><svg viewBox="0 0 20 20" fill="none"><path d="M6.4 6.4l7.2 7.2M13.6 6.4l-7.2 7.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span>
        </button>
        <button class="welcome-recent-chip" style="--chip-color:#8a3b2e">
          <span class="chip-swatch"></span>
          <span class="chip-copy"><strong>测试</strong><em>寒露</em></span>
          <span class="chip-forget"><svg viewBox="0 0 20 20" fill="none"><path d="M6.4 6.4l7.2 7.2M13.6 6.4l-7.2 7.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span>
        </button>
      </div>
    </div>

    <div class="term-rail">
      <button class="term-swatch" style="--swatch:#7d8f6e"><span class="term-name">立春</span><span class="term-color">缥碧</span></button>
      <button class="term-swatch" style="--swatch:#8a3b2e"><span class="term-name">寒露</span><span class="term-color">竹青</span></button>
      <button class="term-swatch" style="--swatch:#6a8a9a"><span class="term-name">雨水</span><span class="term-color">天水</span></button>
      <button class="term-swatch" data-light="true" style="--swatch:#c4a882"><span class="term-name">秋分</span><span class="term-color">缃叶</span></button>
      <button class="term-swatch" style="--swatch:#4a5c48"><span class="term-name">冬至</span><span class="term-color">松花</span></button>
      <button class="term-swatch active" data-light="true" style="--swatch:#9aab8c"><span class="term-name">谷雨</span><span class="term-color">艾绿</span></button>
    </div>
  </section>

  <div class="welcome-preview">
    <div class="pv-shell">
      <aside class="pv-side">
        <div class="pv-brand"><i></i>V5Notes</div>
        <div class="pv-item">日记</div>
        <div class="pv-item on">今日</div>
        <div class="pv-item">项目</div>
      </aside>
      <div class="pv-main">
        <div class="pv-bar"><strong>今日</strong><span>预览中</span><span class="pv-edit">编辑</span></div>
        <p class="pv-h">今日</p>
        <p class="pv-p">编辑器占满剩余宽度；右侧大纲与查找随手可用。</p>
      </div>
      <aside class="pv-out"><span>大纲</span><span>· 今日</span><span style="padding-left:10px">晨间</span><span style="padding-left:10px">待办</span></aside>
    </div>
  </div>

  <script>
    // Mirror src/appearance/vaultColors.ts vaultOnColor(): pick ink or paper by luminance.
    const hex = c => { const n = parseInt(c.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
    const lum = ([r, g, b]) => (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    document.querySelectorAll('.term-swatch').forEach(el => {
      const c = getComputedStyle(el).getPropertyValue('--swatch').trim();
      if (/^#[0-9a-f]{6}$/i.test(c)) el.dataset.light = String(lum(hex(c)) > 0.55);
    });
  </script>
</body>
</html>
