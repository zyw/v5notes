<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>三方向对比</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 1932px; height: 586px; background: #e7dfd0; font-family: 'DM Sans', 'PingFang SC', sans-serif; color: #2d2b24; padding: 30px 34px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }
  .card { min-width: 0; }
  .shot { height: 422px; overflow: hidden; box-shadow: 0 8px 22px #4b3e2a22; background: #f3efe4; }
  .shot img { width: 100%; display: block; }
  .cap { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-top: 16px; }
  .cap strong { font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 21px; letter-spacing: -.02em; }
  .cap span { font-family: 'SF Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: .08em; color: #7c7464; }
</style>
</head>
<body>
  <div class="grid">
    <div class="card"><div class="shot"><img src="dir-1.png" alt=""></div><div class="cap"><strong>01 · 案头</strong><span>EDITORIAL INDEX</span></div></div>
    <div class="card"><div class="shot"><img src="dir-2.png" alt=""></div><div class="cap"><strong>02 · 工作台</strong><span>CLIENT2 WORKBENCH</span></div></div>
    <div class="card"><div class="shot"><img src="dir-3.png" alt=""></div><div class="cap"><strong>03 · 书页</strong><span>BOOK SPREAD</span></div></div>
  </div>
</body>
</html>
