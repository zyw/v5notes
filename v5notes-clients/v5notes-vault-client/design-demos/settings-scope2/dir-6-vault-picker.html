<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>F · 库面板选库卡</title><style>
:root {
  --bg: #f3efe4; --panel: #fbf7ee; --ink: #2a2924; --muted: #7a7368; --line: #d8d0c4;
  --accent: #2f5b48; --accent-hover: #244636; --surface: #ebe4d4; --danger: #8a3b2e;
  --vault: #8a3b2e;
  --font-display: 'Noto Serif SC', 'Songti SC', 'Iowan Old Style', 'Palatino Linotype', serif;
  --font-ui: 'DM Sans', 'PingFang SC', sans-serif;
  --font-mono: 'SF Mono', ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); -webkit-font-smoothing: antialiased; }
button { font-family: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid color-mix(in srgb, var(--accent) 65%, transparent); outline-offset: 2px; }
svg { fill: none; stroke: currentColor; stroke-width: 1.55; stroke-linecap: round; stroke-linejoin: round; }
.ribbon { width: 44px; height: 100vh; position: fixed; inset: 0 auto 0 0; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 16px; }
.ribbon .mk { width: 24px; height: 24px; border-radius: 7px; background: var(--accent); }
.ribbon .sp { flex: 1; }
.ribbon .g { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; color: var(--muted); margin-bottom: 12px; }
.ribbon .g.on { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.ribbon .g svg { width: 14px; height: 14px; }
.stage { margin-left: 44px; height: 100vh; display: grid; grid-template-columns: 236px minmax(0, 1fr); }
.side { height: 100%; min-height: 0; display: flex; flex-direction: column; padding: 22px 16px 18px; background: color-mix(in srgb, var(--panel) 60%, var(--bg)); border-right: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 9px; padding: 0 6px; }
.brand .mk { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); }
.brand b { font-family: var(--font-display); font-size: 14px; letter-spacing: -0.02em; }
.side h1 { margin: 26px 6px 0; font-family: var(--font-display); font-size: 25px; font-weight: 700; letter-spacing: -0.03em; }
.nav { margin-top: 16px; display: grid; gap: 2px; }
.nav-item { display: flex; align-items: center; gap: 9px; min-height: 32px; padding: 0 9px; border-radius: 7px; color: var(--muted); text-align: left; font-size: 12px; transition: background .14s, color .14s; }
.nav-item svg { width: 14px; height: 14px; flex: none; }
.nav-item:hover { background: color-mix(in srgb, var(--panel) 65%, var(--surface)); color: var(--ink); }
.nav-item.on { background: color-mix(in srgb, var(--accent) 11%, var(--panel)); color: var(--accent); font-weight: 600; }
.nav-group { margin-top: 8px; display: flex; align-items: center; gap: 7px; padding: 0 9px; height: 26px; font-size: 10px; color: var(--muted); }
.nav-group .tag { font-family: var(--font-mono); font-size: 8px; padding: 1px 4px; border-radius: 3px; border: 1px solid color-mix(in srgb, var(--line) 90%, transparent); }
.nav-group .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); font-weight: 600; }
.side-foot { margin-top: auto; padding: 10px 8px 0; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 9px; }
.avatar { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 10%, var(--panel)); color: var(--accent); font-size: 11px; font-weight: 700; }
.side-foot b { display: block; font-size: 10px; }
.side-foot span { display: block; margin-top: 1px; font-family: var(--font-mono); font-size: 7.5px; color: var(--muted); }
.main { min-width: 0; overflow-y: auto; padding: 30px 40px 64px; }
.inner { margin: 0 auto; }
.stack { display: flex; flex-direction: column; gap: 18px; }
.panel { border: 1px solid color-mix(in srgb, var(--line) 88%, transparent); border-radius: 15px; background: linear-gradient(180deg, color-mix(in srgb, var(--panel) 92%, #fff 8%), var(--panel)); box-shadow: inset 0 1px 0 color-mix(in srgb, #fff 18%, transparent), 0 10px 24px color-mix(in srgb, #000 5%, transparent); }
.p-head { display: flex; align-items: center; gap: 9px; padding: 18px 22px 10px; }
.p-head .ico { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 10%, var(--panel)); color: var(--accent); flex: none; }
.p-head .ico svg { width: 14px; height: 14px; }
.p-head h3 { margin: 0; font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: -.03em; }
.p-head .state { font-size: 10.5px; color: var(--muted); white-space: nowrap; }
.p-head::after { content: ''; flex: 1 1 auto; min-width: 14px; height: 1px; margin: 0 4px; background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 16%, var(--line)), transparent); }
.p-body { padding: 4px 22px 20px; }
.p-lead { margin: 0 0 14px; font-size: 12.5px; line-height: 1.7; color: var(--muted); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 11px 0; border-top: 1px solid color-mix(in srgb, var(--line) 84%, transparent); }
.row strong { display: block; font-size: 11.5px; font-weight: 600; }
.row .hint { display: block; margin-top: 2px; font-size: 10px; line-height: 1.5; color: var(--muted); }
.seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 6px; background: color-mix(in srgb, var(--surface) 60%, var(--panel)); }
.seg button { height: 27px; padding: 0 11px; border-radius: 4px; font-size: 10.5px; color: var(--muted); white-space: nowrap; }
.seg button.on { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px color-mix(in srgb, #000 8%, transparent); }
.sw { width: 34px; height: 19px; flex: none; border-radius: 99px; background: color-mix(in srgb, var(--line) 80%, var(--muted)); position: relative; transition: background .16s; }
.sw span { position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,.18); transition: transform .16s; }
.sw.on { background: var(--accent); }
.sw.on span { transform: translateX(15px); }
.ghost { height: 30px; padding: 0 11px; display: inline-flex; align-items: center; gap: 5px; border: 1px solid color-mix(in srgb, var(--line) 92%, transparent); border-radius: 6px; background: var(--panel); font-size: 10.5px; }
.ghost:hover { border-color: color-mix(in srgb, var(--muted) 60%, var(--line)); background: color-mix(in srgb, var(--panel) 70%, var(--surface)); }
.primary { height: 32px; padding: 0 14px; display: inline-flex; align-items: center; gap: 6px; border-radius: 7px; color: #fff; font-size: 11px; font-weight: 600; background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 88%, #fff 12%), var(--accent)); box-shadow: 0 1px 2px rgba(0,0,0,.16); }
.field { display: grid; gap: 5px; margin-top: 12px; }
.field span { font-size: 10px; color: var(--muted); }
.field input { height: 34px; padding: 0 10px; border: 1px solid color-mix(in srgb, var(--line) 92%, transparent); border-radius: 5px; background: var(--panel); color: var(--ink); font-size: 12px; font-family: inherit; }
.theme-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
.theme { padding: 7px; border: 1px solid color-mix(in srgb, var(--line) 92%, transparent); border-radius: 7px; background: var(--panel); text-align: left; }
.theme.on { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 16%, transparent); }
.theme-prev { position: relative; height: 58px; border-radius: 4px; overflow: hidden; border: 1px solid color-mix(in srgb, var(--line) 86%, transparent); background: var(--bg); }
.theme-prev.dusk { background: #252b24; border-color: #3b4239; }
.theme-prev .rail { position: absolute; inset: 0 auto 0 0; width: 8px; background: color-mix(in srgb, var(--panel) 80%, var(--surface)); }
.theme-prev.dusk .rail { background: #1c211c; }
.theme-prev .bar { position: absolute; left: 16px; height: 3px; border-radius: 2px; background: color-mix(in srgb, var(--line) 88%, transparent); }
.theme-prev .b1 { top: 13px; width: 42%; background: var(--accent); }
.theme-prev .b2 { top: 21px; width: 55%; }
.theme-prev .b3 { top: 29px; width: 33%; }
.theme-prev .dot { position: absolute; left: 16px; bottom: 9px; width: 23px; height: 4px; background: var(--vault); }
.theme-prev .page { position: absolute; right: 8px; top: 9px; width: 26px; height: 39px; border-radius: 2px; background: var(--panel); border: 1px solid color-mix(in srgb, var(--line) 76%, transparent); }
.theme-name { display: flex; align-items: center; padding: 5px 2px 1px; font-size: 10.5px; font-weight: 600; }
.theme-name .ck { margin-left: auto; width: 12px; height: 12px; border-radius: 50%; border: 1px solid color-mix(in srgb, var(--line) 92%, transparent); display: grid; place-items: center; color: transparent; font-size: 7px; }
.theme.on .theme-name .ck { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.theme-desc { padding: 0 2px 1px; font-size: 9px; line-height: 1.4; color: var(--muted); }
.swatches { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.swatch { display: grid; gap: 5px; justify-items: center; min-width: 0; }
.swatch-bar { width: 100%; height: 32px; border-radius: 3px; border: 1px solid rgba(0,0,0,.08); }
.swatch.on .swatch-bar { box-shadow: 0 0 0 1px var(--panel), 0 0 0 2px var(--ink); }
.swatch-label { font-size: 8.5px; line-height: 1.35; text-align: center; color: var(--muted); }
.swatch-label b { display: block; color: var(--ink); font-weight: 600; }
.list { list-style: none; margin: 6px 0 0; padding: 0; }
.list li { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid color-mix(in srgb, var(--line) 82%, transparent); }
.list strong { font-size: 11px; font-weight: 600; }
.mono { font-family: var(--font-mono); font-size: 9px; color: color-mix(in srgb, var(--muted) 88%, transparent); }
.small { margin: 10px 0 0; font-size: 10px; line-height: 1.6; color: var(--muted); }
.subhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; }
.subhead strong { font-size: 10px; letter-spacing: .05em; color: var(--muted); }
/* ---- D: 左栏两个口令 ---- */
.side-seg { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 2px; margin: 18px 0 0; border-radius: 8px; background: color-mix(in srgb, var(--surface) 70%, var(--panel)); }
.side-seg button { height: 30px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: var(--muted); }
.side-seg button svg { width: 13px; height: 13px; }
.side-seg button.on { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.vault-card { margin: 14px 0 0; display: flex; align-items: center; gap: 10px; padding: 10px 11px; border: 1px solid color-mix(in srgb, var(--line) 90%, transparent); border-radius: 10px; background: var(--panel); text-align: left; width: 100%; }
.vault-card:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.vault-dot { width: 10px; height: 30px; border-radius: 3px; background: var(--vault); flex: none; }
.vault-card .vn { min-width: 0; flex: 1; }
.vault-card .vn b { display: block; font-size: 12px; }
.vault-card .vn span { display: block; margin-top: 2px; font-size: 9.5px; color: var(--muted); }
.vault-card .ch { color: var(--muted); font-size: 10px; display: inline-flex; align-items: center; gap: 3px; }
.vault-card .ch svg { width: 11px; height: 11px; }
.empty-vault { margin: 14px 0 0; padding: 14px 12px; border: 1px dashed color-mix(in srgb, var(--line) 92%, transparent); border-radius: 10px; }
.empty-vault b { display: block; font-size: 12px; }
.empty-vault p { margin: 4px 0 10px; font-size: 10px; line-height: 1.55; color: var(--muted); }
.empty-vault .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.empty-vault .ghost { height: 26px; font-size: 10px; }

/* ---- E: 库设置是库的页面 ---- */
.vault-page { padding: 26px 40px 64px; }
.vp-head { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.vp-head .dot { width: 10px; height: 34px; border-radius: 3px; background: var(--vault); flex: none; }
.vp-head b { font-family: var(--font-display); font-size: 22px; letter-spacing: -.03em; }
.vp-head small { display: block; margin-top: 2px; font-size: 10px; color: var(--muted); font-family: var(--font-mono); }
.vp-tabs { display: inline-flex; gap: 2px; padding: 2px; border-radius: 8px; background: color-mix(in srgb, var(--surface) 70%, var(--panel)); margin-left: auto; }
.vp-tabs button { height: 27px; padding: 0 12px; border-radius: 6px; font-size: 11px; color: var(--muted); }
.vp-tabs button.on { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.vp-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; }
.vp-tile { padding: 11px 12px; border: 1px solid color-mix(in srgb, var(--line) 90%, transparent); border-radius: 10px; background: var(--panel); text-align: left; display: flex; align-items: center; gap: 9px; }
.vp-tile:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.vp-tile.on { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); background: color-mix(in srgb, var(--accent) 7%, var(--panel)); }
.vp-tile svg { width: 15px; height: 15px; color: var(--accent); flex: none; }
.vp-tile b { display: block; font-size: 11.5px; }
.vp-tile small { display: block; margin-top: 1px; font-size: 9px; color: var(--muted); }
.vp-body { margin-top: 16px; }
.vault-ico svg { width: 14px; height: 14px; }

/* ---- F: 库面板里的库选卡 ---- */
.vpick { padding: 10px 14px 6px; }
.vpick .lab { font-size: 9.5px; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
.vchips { display: flex; gap: 7px; flex-wrap: wrap; }
.vchip { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 11px 0 8px; border-radius: 99px; border: 1px solid color-mix(in srgb, var(--line) 92%, transparent); background: var(--panel); font-size: 11.5px; }
.vchip .d { width: 6px; height: 16px; border-radius: 2px; background: var(--vault); }
.vchip:hover { border-color: color-mix(in srgb, var(--muted) 55%, var(--line)); }
.vchip.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--panel)); font-weight: 600; }
.vchip.off { opacity: .55; }
.vchip.off .d { background: var(--muted); }
.vchip .st { font-family: var(--font-mono); font-size: 8px; color: var(--muted); }
.scope-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 9.5px; color: var(--accent); }
.scope-badge i { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
.none-state { margin: 14px 0 0; padding: 20px 0 8px; text-align: center; }
.none-state svg { width: 26px; height: 26px; color: var(--muted); }
.none-state p { margin: 8px 0 12px; font-size: 11px; color: var(--muted); }
</style></head><body><div class="ribbon"><div class="mk"></div><div class="sp"></div><button class="g on" aria-label="设置"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.4"/><path d="M8 2.2v1.6M8 12.2v1.6M2.2 8h1.6M12.2 8h1.6M3.9 3.9l1.1 1.1M11 11l1.1 1.1M12.1 3.9 11 5M5 11l-1.1 1.1"/></svg></button></div><div class="stage"><aside class="side"><div class="brand"><span class="mk"></span><b>V5Notes</b></div><h1>设置</h1><nav class="nav" aria-label="设置分区">
  <div class="nav-group" style="margin-top:2px"><span>全局</span><span class="mono">所有库</span></div>
